<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Manage Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
        <a class="navbar-brand fw-bold text-white" href="/admin/dashboard">Reality Show Admin</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/episodeView">Shows</a></li>
            <li class="nav-item"><a class="nav-link" href="/contestantView">Contestants</a></li>
            <li class="nav-item"><a class="nav-link" href="/voteSessionA">Voting Sessions</a></li>
            <li class="nav-item"><a class="nav-link" href="/resultsA">Results</a></li>
            <li class="nav-item"><a class="nav-link active" href="/admin/feedbackA">Feedback</a></li>
            <li class="nav-item"><a class="nav-link text-danger" href="/admin/logout">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="container my-5">
    <h2 class="fw-bold text-2xl mb-4">Feedback Management</h2>

    <!-- Feedback Table -->
    <div class="card shadow">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>User</th>
                    <th>Message</th>
                    <th>Rating</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="f : ${feedbackList}">
                    <td th:text="${f.feedbackId}">1</td>
                    <td th:text="${f.user.username}">JohnDoe</td>
                    <td th:text="${f.message}">Great platform!</td>
                    <td th:text="${f.rating != null ? f.rating : '-'}">5</td>
                    <td th:text="${#temporals.format(f.submittedAt, 'yyyy-MM-dd HH:mm')}">2025-09-19</td>
                    <td>
                        <form th:action="@{/admin/feedback/delete/{id}(id=${f.feedbackId})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger"
                                    onclick="return confirm('Delete this feedback?')">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(feedbackList)}">
                    <td colspan="6" class="text-center text-muted">No feedback available.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
    © 2025 Reality Show Voting Platform - Admin Panel
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://kit.fontawesome.com/a2e0adfb58.js" crossorigin="anonymous"></script>
</body>
</html>
