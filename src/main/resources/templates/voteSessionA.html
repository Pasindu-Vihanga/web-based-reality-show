<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Voting Sessions - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="text-center text-primary fw-bold mb-4">Voting Session Management</h2>

    <!-- Sessions Table -->
    <table class="table table-striped">
        <thead><tr><th>Episode</th><th>Start</th><th>End</th><th>Status</th><th>Votes</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="s : ${sessionList}">
            <td th:text="${s.show.showTitle}">Episode</td>
            <td th:text="${s.startTime}">Start</td>
            <td th:text="${s.endTime}">End</td>
            <td><span class="badge" th:classappend="${s.active} ? 'bg-success':'bg-secondary'"
                      th:text="${s.status}">Live</span></td>
            <td th:text="${s.currentVotes}">0</td>
            <td>
                <form th:action="@{'/session/delete/' + ${s.sessionId}}" method="post" class="d-inline">
                    <button class="btn btn-danger btn-sm">Delete</button>
                </form>
                <button class="btn btn-warning btn-sm" th:onclick="'toggleSession(' + ${s.sessionId} + ')'">Toggle</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script>
    function toggleSession(id) {
        fetch('/api/votes/toggle/' + id, { method: 'POST' })
            .then(() => location.reload());
    }
</script>
</body>
</html>
