<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Admin - Reality Show</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border-radius: 1rem;
        }
    </style>
</head>
<body class="bg-gray-100">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand text-white fw-bold" href="/admin/dashboard">Reality Show Admin</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/admin/manage">Manage Admins</a></li>
                <li class="nav-item"><a class="nav-link" href="/episodeView">Manage Shows</a></li>
                <li class="nav-item"><a class="nav-link" href="/voteSessionA">Manage Voting</a></li>
                <li class="nav-item"><a class="nav-link text-danger" href="/admin/logout">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Edit Admin Form -->
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg p-4">
                <h2 class="mb-4 text-center text-indigo-600">Edit Admin</h2>

                <form th:action="@{/admin/update}" method="post" th:object="${admin}">
                    <!-- Hidden ID -->
                    <input type="hidden" th:field="*{adminID}">

                    <div class="mb-3">
                        <label class="form-label">Admin Name</label>
                        <input type="text" th:field="*{adminName}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" th:field="*{adminPassword}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Role Name</label>
                        <input type="text" th:field="*{roleName}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Role ID</label>
                        <input type="text" th:field="*{roleID}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mobile</label>
                        <input type="text" th:field="*{mobileNumber}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <textarea th:field="*{address}" class="form-control"></textarea>
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex justify-content-between">
                        <a href="/admin/manage" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-1"></i> Back
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i> Update Admin
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://kit.fontawesome.com/a2e0adfb58.js" crossorigin="anonymous"></script>
</body>
</html>
