<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --accent: #ff4d94;
            --dark: #1a1a2e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            color: white;
            width: 250px;
            min-height: 100vh;
            padding: 20px 15px;
            position: fixed;
        }

        .sidebar h3 {
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            text-decoration: none;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .sidebar a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Main content */
        .main-content {
            margin-left: 250px;
            padding: 30px;
            width: 100%;
            color: white;
        }

        .dashboard-header {
            margin-bottom: 30px;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid white;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 15px;
            padding: 20px;
            color: white;
            transition: all 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .card i {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--accent);
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h3>
        <i class="fas fa-user-circle me-2"></i> Dashboard
    </h3>
    <a th:href="@{/dashboardU}"><i class="fas fa-home me-2"></i> Home</a>
    <a th:href="@{/userView}"><i class="fas fa-users me-2"></i> Users</a>
    <a th:href="@{/editProfile}"><i class="fas fa-user me-2"></i> Edit Profile</a>
    <a th:href="@{/vote}"><i class="fas fa-vote-yea me-2"></i> Vote</a>
    <a th:href="@{/results}"><i class="fas fa-trophy me-2"></i> Results</a>
    <a th:href="@{/logout}"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="dashboard-header text-center">
        <!-- Profile Image -->
        <img th:if="${user.imagePath != null}" th:src="@{${user.imagePath}}"
             alt="Profile Picture" class="profile-img">
        <img th:if="${user.imagePath == null}" src="/images/default-avatar.png"
             alt="Default Profile Picture" class="profile-img">

        <!-- Welcome Message -->
        <h1>
            Welcome, <span th:text="${user.username}">User</span> 👋
        </h1>
        <p>Your email: <span th:text="${user.email}">example@mail.com</span></p>
    </div>

    <div class="row g-4">
        <!-- Voting Card -->
        <div class="col-md-4">
            <div class="card text-center">
                <i class="fas fa-vote-yea"></i>
                <h4>Vote Now</h4>
                <p>Support your favorite contestants.</p>
                <a th:href="@{/vote}" class="btn btn-sm btn-light">Go</a>
            </div>
        </div>

        <!-- Results Card -->
        <div class="col-md-4">
            <div class="card text-center">
                <i class="fas fa-trophy"></i>
                <h4>View Results</h4>
                <p>Check the latest competition standings.</p>
                <a th:href="@{/resultsU}" class="btn btn-sm btn-light">Go</a>
            </div>
        </div>

        <!-- Episode Card -->
        <div class="col-md-4">
            <div class="card text-center">
                <i class="fas fa-vote-yea"></i>
                <h4>View Episodes</h4>
                <p>View your favorite episodes</p>
                <a th:href="@{/epiforUser}" class="btn btn-sm btn-light">Go</a>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
