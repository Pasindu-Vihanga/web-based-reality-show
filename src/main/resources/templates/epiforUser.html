<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User - Episodes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="mb-4"><i class="fas fa-film me-2"></i>Available Episodes</h2>

    <!-- Search -->
    <form th:action="@{/episodeManage/search}" method="get" class="d-flex mb-3">
        <input type="text" name="keyword" class="form-control me-2" placeholder="Search episodes..."
               th:value="${searchKeyword}">
        <button class="btn btn-primary"><i class="fas fa-search"></i></button>
    </form>

    <!-- Episodes List -->
    <div class="row">
        <div class="col-md-4 mb-3" th:each="ep : ${episodeList}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 th:text="${ep.showTitle}">Episode Title</h5>
                    <p class="text-muted" th:text="${ep.showType}">Type</p>
                    <p th:text="${ep.showDescription}">Description...</p>
                    <p><strong>Date:</strong> <span th:text="${ep.showDate}"></span></p>
                    <p><strong>Time:</strong> <span th:text="${ep.showTime}"></span></p>
                </div>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(episodeList)}" class="text-center text-muted">No episodes found.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
