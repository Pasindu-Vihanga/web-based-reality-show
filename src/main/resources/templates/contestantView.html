<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contestant Management - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand text-white" href="#">Reality Show Admin</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/episodeView">Shows</a></li>
            <li class="nav-item"><a class="nav-link" href="/sessionView">Sessions</a></li>
            <li class="nav-item"><a class="nav-link" href="/contestantView">Contestants</a></li>
        </ul>
    </div>
</nav>

<div class="container my-5">
    <h1 class="text-2xl font-bold mb-4">Contestant Management</h1>

    <!-- Add Contestant Form -->
    <form th:action="@{/contestant/add}" method="post" class="mb-5 card p-4 shadow-lg">
        <h5 class="mb-3 font-semibold">Add New Contestant</h5>
        <div class="mb-3">
            <input type="text" name="name" placeholder="Contestant Name" class="form-control" required>
        </div>
        <div class="mb-3">
            <textarea name="bio" placeholder="Contestant Bio" class="form-control"></textarea>
        </div>
        <div class="mb-3">
            <input type="text" name="imageUrl" placeholder="Image URL" class="form-control">
        </div>
        <div class="mb-3">
            <select name="status" class="form-select" required>
                <option value="active">Active</option>
                <option value="eliminated">Eliminated</option>
            </select>
        </div>
        <div class="mb-3">
            <input type="text" name="show.episodeId" placeholder="Episode ID" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Contestant</button>
    </form>

    <!-- Contestant List -->
    <table class="table table-striped table-hover shadow">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Status</th>
            <th>Episode</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="contestant : ${contestantList}">
            <td th:text="${contestant.contestantId}"></td>
            <td th:text="${contestant.name}"></td>
            <td th:text="${contestant.status}"></td>
            <td th:text="${contestant.show.episodeId}"></td>
            <td>
                <a th:href="@{'/contestant/edit/' + ${contestant.contestantId}}" class="btn btn-sm btn-warning">Edit</a>
                <form th:action="@{'/contestant/delete/' + ${contestant.contestantId}}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
    © 2025 Reality Show Voting Platform - Admin Panel
</footer>

</body>
</html>
