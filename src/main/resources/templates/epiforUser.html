<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Available Episode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="text-center text-primary mb-4">Available Episode</h2>

    <div th:if="${episode == null}" class="alert alert-info text-center">
        No available episodes right now. Please check back later!
    </div>

    <div th:if="${episode != null}" class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h4 th:text="${episode.showTitle}"></h4>
            <small>
                Date: <span th:text="${episode.showDate}"></span> |
                Time: <span th:text="${episode.showTime}"></span> |
                Status: <span th:text="${episode.status}"></span>
            </small>
        </div>
        <div class="card-body">
            <h5 class="text-success">Voting Sessions</h5>

            <div th:each="s : ${episode.sessions}" class="mb-4 p-3 border rounded">
                <h6>
                    Session <span th:text="${s.sessionId}"></span> |
                    <span th:text="${#temporals.format(s.startTime, 'yyyy-MM-dd HH:mm')}"></span> →
                    <span th:text="${#temporals.format(s.endTime, 'yyyy-MM-dd HH:mm')}"></span>
                    <span class="badge bg-info" th:text="${s.status}"></span>
                </h6>

                <h6 class="mt-3">Contestants</h6>
                <div th:if="${#lists.isEmpty(episode.contestants)}" class="text-muted">
                    No contestants assigned to this episode yet.
                </div>

                <div class="row" th:if="${!#lists.isEmpty(episode.contestants)}">
                    <div class="col-md-4 mb-3" th:each="c : ${episode.contestants}">
                        <div class="card h-100">
                            <div class="card-body text-center">
                                <h6 th:text="${c.name}"></h6>
                                <p th:text="${c.bio}"></p>

                                <!-- Show vote count if result exists -->
                                <p>
                                    Votes:
                                    <span th:text="${
                                        #lists.isEmpty(s.results) ? 0 :
                                        (s.results.?[contestant.contestantId == c.contestantId].size() > 0
                                          ? s.results.?[contestant.contestantId == c.contestantId].get(0).votesCount
                                          : 0)
                                    }"></span>
                                </p>

                                <form th:action="@{/vote/cast}" method="post">
                                    <input type="hidden" name="sessionId" th:value="${s.sessionId}"/>
                                    <input type="hidden" name="contestantId" th:value="${c.contestantId}"/>
                                    <button type="submit" class="btn btn-success btn-sm">Vote</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Show message after voting -->
    <div th:if="${message}" class="alert alert-success text-center mt-3" th:text="${message}"></div>
</div>
</body>
</html>
