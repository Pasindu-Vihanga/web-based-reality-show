<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contestants - User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .contestant-card:hover {
            transform: translateY(-5px);
            transition: 0.3s ease-in-out;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="bg-gray-50">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow">
    <div class="container">
        <a class="navbar-brand font-bold text-indigo-600" href="/dashboardU">Reality Show Voting</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/epiforUser">Episodes</a></li>
            <li class="nav-item"><a class="nav-link" href="/results">Results</a></li>
            <li class="nav-item"><a class="nav-link text-danger" href="/logout">Logout</a></li>
        </ul>
    </div>
</nav>

<!-- Main Content -->
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-2xl font-bold">Contestants for Episode</h1>
        <a th:href="@{/epiforUser}" class="btn btn-outline-primary">
            <i class="fas fa-arrow-left me-1"></i> Back to Episodes
        </a>
    </div>

    <!-- Contestants Grid -->
    <div class="row">
        <div th:each="contestant : ${contestantList}" class="col-md-4 mb-4">
            <div class="card contestant-card shadow-lg rounded-2xl h-100">
                <img th:src="@{${contestant.imageUrl}}" class="card-img-top rounded-t-2xl" alt="Contestant Image">

                <div class="card-body text-center">
                    <h5 class="card-title text-indigo-700 font-semibold" th:text="${contestant.name}">Contestant Name</h5>
                    <p class="card-text text-gray-600" th:text="${contestant.bio}">Contestant Bio</p>

                    <!-- Status Badge -->
                    <div class="mb-2">
                        <span th:if="${contestant.status == 'active'}" class="badge bg-success">Active</span>
                        <span th:if="${contestant.status == 'eliminated'}" class="badge bg-danger">Eliminated</span>
                    </div>

                    <!-- Vote Button (Only if Active) -->
                    <form th:if="${contestant.status == 'active'}"
                          th:action="@{'/vote/' + ${contestant.contestantId}}" method="post">
                        <button type="submit" class="btn btn-success mt-2 w-100">
                            <i class="fas fa-vote-yea me-1"></i> Vote
                        </button>
                    </form>

                    <button th:if="${contestant.status == 'eliminated'}"
                            class="btn btn-secondary mt-2 w-100" disabled>
                        Eliminated
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- No Contestants -->
    <div th:if="${contestantList.size() == 0}" class="text-center mt-5">
        <i class="fas fa-exclamation-circle fa-2x mb-3 text-warning"></i>
        <p class="text-lg">No contestants available for this episode.</p>
    </div>
</div>

<!-- Footer -->
<footer class="bg-light text-center py-3 mt-5 shadow-inner">
    © 2025 Reality Show Voting Platform - User Panel
</footer>

<!-- Bootstrap + Font Awesome -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</body>
</html>
