<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Results Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="fw-bold text-primary">Results Management</h2>

    <table class="table table-bordered shadow">
        <thead class="table-dark"><tr><th>Contestant</th><th>Episode</th><th>Votes</th><th>Place</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="r : ${resultList}">
            <td th:text="${r.contestant.name}"></td>
            <td th:text="${r.votingSession.show.showTitle}"></td>
            <td th:text="${r.votesCount}"></td>
            <td th:text="${r.place}"></td>
            <td th:text="${r.status}"></td>
            <td>
                <a th:href="@{/result/edit/{id}(id=${r.resultId})}" class="btn btn-sm btn-warning">Edit</a>
                <form th:action="@{/result/delete/{id}(id=${r.resultId})}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
