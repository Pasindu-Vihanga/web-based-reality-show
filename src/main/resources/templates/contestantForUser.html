<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vote Contestants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="text-center text-success">Vote for Contestants</h2>

    <div class="row g-4">
        <div class="col-md-4" th:each="c : ${contestantList}">
            <div class="card shadow-sm">
                <img th:if="${c.image != null}" th:src="@{'/contestant/image/' + ${c.contestantId}}" class="card-img-top" style="height:200px;object-fit:cover">
                <div class="card-body">
                    <h5 th:text="${c.name}"></h5>
                    <p th:text="${c.bio}"></p>
                    <form th:action="@{/vote/{id}(id=${c.contestantId})}" method="post">
                        <button class="btn btn-primary w-100">Vote</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
