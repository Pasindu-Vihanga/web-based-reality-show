<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Episode Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="text-primary">Episode Management</h2>

    <!-- Add Episode -->
    <form th:action="@{/add}" th:object="${show}" method="post" class="card p-3 mb-4 shadow-sm">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Title</label>
                <input type="text" th:field="*{showTitle}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Type</label>
                <input type="text" th:field="*{showType}" class="form-control">
            </div>
        </div>
        <div class="mb-3">
            <label>Description</label>
            <textarea th:field="*{showDescription}" class="form-control"></textarea>
        </div>
        <div class="row">
            <div class="col-md-3 mb-3">
                <label>Date</label>
                <input type="date" th:field="*{showDate}" class="form-control">
            </div>
            <div class="col-md-3 mb-3">
                <label>Time</label>
                <input type="time" th:field="*{showTime}" class="form-control">
            </div>
            <div class="col-md-3 mb-3">
                <label>Status</label>
                <select th:field="*{status}" class="form-select">
                    <option value="Upcoming">Upcoming</option>
                    <option value="Ongoing">Ongoing</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <button type="submit" class="btn btn-success w-100">Add Episode</button>
            </div>
        </div>
    </form>

    <!-- Episodes Table -->
    <table class="table table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Title</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
            <th>Voting Sessions</th>
            <th>Contestants</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ep : ${episodeList}">
            <td th:text="${ep.showTitle}"></td>
            <td th:text="${ep.showDate}"></td>
            <td th:text="${ep.showTime}"></td>
            <td th:text="${ep.status}"></td>
            <td>
                <ul class="list-unstyled mb-0">
                    <li th:each="s : ${ep.sessions}">
                        <span class="badge bg-primary" th:text="${s.sessionId}"></span>
                        (<span th:text="${#temporals.format(s.startTime, 'yyyy-MM-dd HH:mm')}"></span> →
                        <span th:text="${#temporals.format(s.endTime, 'yyyy-MM-dd HH:mm')}"></span>)
                        <span class="badge bg-info" th:text="${s.status}"></span>
                    </li>
                    <li th:if="${#lists.isEmpty(ep.sessions)}" class="text-muted">No sessions yet</li>
                </ul>
            </td>
            <td>
                <ul class="list-unstyled mb-0">
                    <li th:each="c : ${ep.contestants}">
                        <span class="badge bg-success" th:text="${c.name}"></span>
                        <span th:text="'[' + ${c.status} + ']'"></span>
                    </li>
                    <li th:if="${#lists.isEmpty(ep.contestants)}" class="text-muted">No contestants yet</li>
                </ul>
            </td>
            <td>
                <form th:action="@{/delete/{id}(id=${ep.episodeId})}" method="post" class="d-inline">
                    <button class="btn btn-danger btn-sm">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
