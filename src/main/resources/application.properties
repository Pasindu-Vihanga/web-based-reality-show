# Application name
spring.application.name=Web-Based-Reality-Show-Voting-System

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=chamodith
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Connection pool (HikariCP) tuning (optional, improves performance)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Allow serving uploaded files
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# Server port (optional, custom port)
# server.port=8081

# Logging SQL Bind Parameters (optional, for debugging)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
