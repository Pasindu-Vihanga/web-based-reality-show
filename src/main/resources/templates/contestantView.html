<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contestant Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        function previewImage(event, previewId) {
            const reader = new FileReader();
            reader.onload = function () {
                document.getElementById(previewId).src = reader.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="text-primary">Contestant Management</h2>

    <!-- Add Contestant Form -->
    <form th:action="@{/contestant/add}" th:object="${contestant}" method="post" enctype="multipart/form-data"
          class="card p-3 mb-4 shadow-sm">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Name</label>
                <input type="text" th:field="*{name}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Status</label>
                <select th:field="*{status}" class="form-select" required>
                    <option value="active">Active</option>
                    <option value="eliminated">Eliminated</option>
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label>Bio</label>
            <textarea th:field="*{bio}" class="form-control"></textarea>
        </div>

        <div class="mb-3">
            <label>Episode</label>
            <select th:field="*{show.episodeId}" class="form-select" required>
                <option th:each="ep : ${episodeList}" th:value="${ep.episodeId}" th:text="${ep.showTitle}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label>Image</label>
            <input type="file" name="imageFile" class="form-control"
                   onchange="previewImage(event, 'previewNew')">
            <img id="previewNew" src="" class="img-fluid mt-2" style="max-height:150px; display:block;">
        </div>

        <button type="submit" class="btn btn-success">Add Contestant</button>
    </form>

    <!-- Contestants Table -->
    <table class="table table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Bio</th>
            <th>Status</th>
            <th>Episode</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${contestantList}">
            <td>
                <img th:if="${c.image != null}" th:src="@{'/images/' + ${c.contestantId}}"
                     class="img-thumbnail" style="max-height:80px;">
            </td>
            <td th:text="${c.name}"></td>
            <td th:text="${c.bio}"></td>
            <td>
                <span class="badge" th:classappend="${c.status == 'active'} ? 'bg-success' : 'bg-secondary'"
                      th:text="${c.status}"></span>
            </td>
            <td th:text="${c.show.showTitle}"></td>
            <td>
                <a th:href="@{/contestant/edit/{id}(id=${c.contestantId})}" class="btn btn-primary btn-sm">Edit</a>
                <form th:action="@{/contestant/delete/{id}(id=${c.contestantId})}" method="post" class="d-inline">
                    <button class="btn btn-danger btn-sm">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
