<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contestants - VoteStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .card { border-radius: 12px; transition: transform .2s; }
        .card:hover { transform: translateY(-5px); }
        .contestant-img { width: 100%; height: 220px; object-fit: cover; border-radius: 10px; }
        .status { font-weight: 600; }
    </style>
</head>
<body>
<div class="container mt-4">
    <h2 class="text-center text-success fw-bold mb-4">Contestants</h2>

    <div class="row g-4">
        <div class="col-md-4" th:each="c : ${contestantList}">
            <div class="card shadow p-3 h-100">
                <img th:src="@{'/contestant/image/' + ${c.contestantId}}" class="contestant-img mb-3" alt="Contestant Image">
                <h5 th:text="${c.name}">Name</h5>
                <p th:text="${c.bio}">Bio...</p>
                <p><strong>Status:</strong> <span th:text="${c.status}" class="status"></span></p>
                <form th:action="@{/vote/{id}(id=${c.contestantId})}" method="post">
                    <button type="submit" class="btn btn-primary w-100"
                            th:disabled="${c.status == 'eliminated'}">
                        Vote
                    </button>
                </form>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(contestantList)}" class="text-center text-muted">
            No contestants found for this episode.
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
