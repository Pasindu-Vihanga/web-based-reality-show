<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vote Now</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="text-center text-success mb-4">Available Voting Sessions</h2>

    <div th:if="${#lists.isEmpty(sessionList)}" class="alert alert-info text-center">
        No ongoing voting sessions at the moment. Please check back later!
    </div>

    <div class="row g-4" th:if="${!#lists.isEmpty(sessionList)}">
        <div class="col-md-4" th:each="s : ${sessionList}">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 th:text="${s.show.showTitle}"></h5>
                    <p><strong>Start:</strong>
                        <span th:text="${#temporals.format(s.startTime,'yyyy-MM-dd HH:mm')}"></span>
                    </p>
                    <p><strong>End:</strong>
                        <span th:text="${#temporals.format(s.endTime,'yyyy-MM-dd HH:mm')}"></span>
                    </p>

                    <!-- ✅ Only allow voting if status is Ongoing -->
                    <div th:if="${s.status == 'Ongoing'}">
                        <a th:href="@{/contestantForUser/{id}(id=${s.show.episodeId})}"
                           class="btn btn-success w-100">Vote</a>
                    </div>
                    <div th:if="${s.status != 'Ongoing'}">
                        <span class="badge bg-secondary w-100 py-2">Voting not open</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
