<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contestant Profiles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .winner-card { border: 3px solid gold; }
        .runnerup-card { border: 2px solid silver; }
        .eliminated-card { opacity: 0.7; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="text-center text-primary mb-4">Meet the Contestants</h2>

    <!-- 🏆 Winner & Runner-up Summary -->
    <div class="row mb-5">
        <div class="col-md-4 offset-md-2" th:if="${winner != null}">
            <div class="card shadow-sm text-center winner-card">
                <div class="card-body">
                    <h4 class="text-warning">🏆 Winner</h4>
                    <img th:if="${winner.image != null}"
                         th:src="@{'/images/' + ${winner.contestantId}}"
                         class="img-fluid rounded mb-2" style="max-height:200px; object-fit:cover;">
                    <h5 th:text="${winner.name}"></h5>
                    <p th:text="${winner.bio}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-4" th:if="${runnerUp != null}">
            <div class="card shadow-sm text-center runnerup-card">
                <div class="card-body">
                    <h4 class="text-secondary">🥈 Runner-up</h4>
                    <img th:if="${runnerUp.image != null}"
                         th:src="@{'/images/' + ${runnerUp.contestantId}}"
                         class="img-fluid rounded mb-2" style="max-height:200px; object-fit:cover;">
                    <h5 th:text="${runnerUp.name}"></h5>
                    <p th:text="${runnerUp.bio}"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- All Contestants Grid -->
    <div class="row">
        <div class="col-md-3 mb-4" th:each="c : ${contestantList}">
            <div class="card shadow-sm h-100 text-center"
                 th:classappend="${c.status == 'winner'} ? 'winner-card' :
                           (${c.status == 'runnerup'} ? 'runnerup-card' :
                           (${c.status == 'eliminated'} ? 'eliminated-card' : ''))">

                <img th:if="${c.image != null}"
                     th:src="@{'/images/' + ${c.contestantId}}"
                     class="card-img-top"
                     alt="Contestant Image"
                     style="max-height:180px; object-fit:cover;">

                <div class="card-body">
                    <h5 th:text="${c.name}" class="card-title"></h5>
                    <p th:text="${c.bio}" class="card-text"></p>
                    <span class="badge"
                          th:classappend="${c.status == 'winner'} ? 'bg-warning text-dark' :
                                (${c.status == 'runnerup'} ? 'bg-secondary' :
                                (${c.status == 'eliminated'} ? 'bg-danger' : 'bg-success'))"
                          th:text="${c.status}">
          </span>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
