<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contestant Profiles</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --accent: #ff4d94;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            background: linear-gradient(to right, #ff4d94, #6a11cb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Card styling */
        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(10px);
            color: white;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-weight: 600;
        }

        /* Status-specific highlights */
        .winner-card {
            border: 3px solid gold;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .runnerup-card {
            border: 2px solid silver;
            box-shadow: 0 0 15px rgba(192, 192, 192, 0.4);
        }

        .eliminated-card {
            opacity: 0.6;
        }

        /* Badge styling */
        .badge {
            font-size: 0.85rem;
            padding: 0.4rem 0.8rem;
            border-radius: 30px;
        }

        .bg-warning.text-dark {
            background: linear-gradient(to right, #f9d423, #ff4e50) !important;
            color: black !important;
        }

        .bg-secondary {
            background: linear-gradient(to right, #a7a7a7, #707070) !important;
        }

        .bg-danger {
            background: linear-gradient(to right, #ff416c, #ff4b2b) !important;
        }

        .bg-success {
            background: linear-gradient(to right, var(--primary), var(--secondary)) !important;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <h2 class="text-center mb-5">Meet the Contestants</h2>

    <!-- 🏆 Winner & Runner-up Summary -->
    <div class="row mb-5">
        <div class="col-md-4 offset-md-2" th:if="${winner != null}">
            <div class="card text-center winner-card">
                <div class="card-body">
                    <h4 class="text-warning">🏆 Winner</h4>
                    <img th:if="${winner.image != null}"
                         th:src="@{'/images/' + ${winner.contestantId}}"
                         class="img-fluid rounded mb-2" style="max-height:200px; object-fit:cover;">
                    <h5 th:text="${winner.name}"></h5>
                    <p th:text="${winner.bio}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-4" th:if="${runnerUp != null}">
            <div class="card text-center runnerup-card">
                <div class="card-body">
                    <h4 class="text-light">🥈 Runner-up</h4>
                    <img th:if="${runnerUp.image != null}"
                         th:src="@{'/images/' + ${runnerUp.contestantId}}"
                         class="img-fluid rounded mb-2" style="max-height:200px; object-fit:cover;">
                    <h5 th:text="${runnerUp.name}"></h5>
                    <p th:text="${runnerUp.bio}"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- All Contestants Grid -->
    <div class="row g-4">
        <div class="col-md-3" th:each="c : ${contestantList}">
            <div class="card h-100 text-center"
                 th:classappend="${c.status == 'winner'} ? 'winner-card' :
                           (${c.status == 'runnerup'} ? 'runnerup-card' :
                           (${c.status == 'eliminated'} ? 'eliminated-card' : ''))">

                <img th:if="${c.image != null}"
                     th:src="@{'/images/' + ${c.contestantId}}"
                     class="card-img-top"
                     alt="Contestant Image"
                     style="height:180px; object-fit:cover;">

                <div class="card-body">
                    <h5 th:text="${c.name}" class="card-title"></h5>
                    <p th:text="${c.bio}" class="card-text text-light"></p>
                    <span class="badge"
                          th:classappend="${c.status == 'winner'} ? 'bg-warning text-dark' :
                                (${c.status == 'runnerup'} ? 'bg-secondary' :
                                (${c.status == 'eliminated'} ? 'bg-danger' : 'bg-success'))"
                          th:text="${c.status}">
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
