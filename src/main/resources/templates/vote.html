<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vote - Reality Show</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow">
    <div class="container">
        <a class="navbar-brand font-bold text-indigo-600" href="/sessionsForUser">Reality Show Voting</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/sessionsForUser">Active Sessions</a></li>
                <li class="nav-item"><a class="nav-link" href="/results">Results</a></li>
                <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Content -->
<div class="container my-5">
    <h1 class="text-2xl font-bold text-center mb-4">Vote for Your Favorite Contestant</h1>

    <!-- Session Info -->
    <div class="alert alert-info text-center mb-5">
        Voting open from <strong th:text="${session.startTime}"></strong>
        to <strong th:text="${session.endTime}"></strong>.
        Max votes per user: <strong th:text="${session.maxVotesPerUser}"></strong>
    </div>

    <!-- Contestant List -->
    <div class="row">
        <div th:each="contestant : ${contestantList}" class="col-md-4 mb-4">
            <div class="card shadow-lg rounded-2xl h-100">
                <img th:src="@{${contestant.imageUrl}}" class="card-img-top rounded-t-2xl" alt="Contestant Image">
                <div class="card-body text-center">
                    <h5 class="card-title text-indigo-700 font-semibold" th:text="${contestant.name}">Contestant Name</h5>
                    <p class="card-text text-gray-600" th:text="${contestant.bio}">Contestant Bio</p>
                    <form th:action="@{'/vote/' + ${session.sessionId} + '/' + ${contestant.id}}" method="post">
                        <button type="submit" class="btn btn-primary mt-2 w-100">Vote</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Feedback Section -->
<div class="container my-5">
    <h3 class="text-xl font-semibold mb-3">Leave Feedback</h3>
    <form th:action="@{'/feedback/' + ${session.sessionId}}" method="post">
        <textarea name="feedback" class="form-control mb-3" rows="4" placeholder="Your thoughts about the show..."></textarea>
        <button type="submit" class="btn btn-success">Submit Feedback</button>
    </form>
</div>

<footer class="bg-light text-center py-3 mt-5 shadow-inner">
    © 2025 Reality Show Voting Platform - User Panel
</footer>

</body>
</html>
