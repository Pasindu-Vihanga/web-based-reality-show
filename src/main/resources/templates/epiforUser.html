<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Episodes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="text-center text-primary">Episodes</h2>

    <div class="row g-4">
        <div class="col-md-4" th:each="ep : ${episodeList}">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 th:text="${ep.showTitle}"></h5>
                    <p th:text="${ep.showDescription}"></p>
                    <p><strong>Date:</strong> <span th:text="${ep.showDate}"></span></p>
                    <p><strong>Time:</strong> <span th:text="${ep.showTime}"></span></p>
                    <p><strong>Status:</strong> <span th:text="${ep.status}"></span></p>
                    <a th:href="@{/contestantForUser/{id}(id=${ep.episodeId})}" class="btn btn-primary w-100">View Contestants</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
