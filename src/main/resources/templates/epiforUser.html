<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Available Episodes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --accent: #ff4d94;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            background: linear-gradient(to right, #ff4d94, #6a11cb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            color: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-success {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            border-radius: 50px;
            font-weight: 600;
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
        }
        .btn-success:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4);
        }

        .badge {
            font-size: 0.85rem;
            padding: 0.6rem 0.8rem;
            border-radius: 30px;
        }
        .bg-secondary {
            background: linear-gradient(to right, #868f96, #596164) !important;
        }

        .alert-info {
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            border: none;
            color: white;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <h2 class="text-center">Available Episodes</h2>

    <div th:if="${#lists.isEmpty(episodes)}" class="alert alert-info text-center">
        <i class="fas fa-info-circle me-2"></i>No available episodes right now. Please check back later!
    </div>

    <div class="row" th:if="${!#lists.isEmpty(episodes)}">
        <div class="col-md-12 mb-4" th:each="episode : ${episodes}">
            <div class="card shadow-sm mb-4 p-3">
                <div class="card-header bg-transparent border-0">
                    <h4 th:text="${episode.showTitle}"></h4>
                    <small>
                        Date: <span th:text="${episode.showDate}"></span> |
                        Time: <span th:text="${episode.showTime}"></span> |
                        Status: <span th:text="${episode.status}"></span>
                    </small>
                </div>
                <div class="card-body">
                    <h5 class="text-info">Voting Sessions</h5>

                    <div th:each="s : ${episode.sessions}" class="mb-5 p-3 border rounded">
                        <h6>
                            <i class="fas fa-clock me-1"></i>
                            Session <span th:text="${s.sessionId}"></span> |
                            <span th:text="${#temporals.format(s.startTime, 'yyyy-MM-dd''T''HH:mm')}"></span> →
                            <span th:text="${#temporals.format(s.endTime, 'yyyy-MM-dd''T''HH:mm')}"></span>
                            <span class="badge bg-info" th:text="${s.status}"></span>
                        </h6>

                        <!-- Contestants -->
                        <h6 class="mt-3">Contestants</h6>
                        <div th:if="${#lists.isEmpty(episode.contestants)}" class="text-muted">
                            No contestants assigned yet.
                        </div>
                        <div class="row" th:if="${!#lists.isEmpty(episode.contestants)}">
                            <div class="col-md-4 mb-3" th:each="c : ${episode.contestants}">
                                <div class="card h-100">
                                    <img th:if="${c.image != null}" th:src="@{'/images/' + ${c.contestantId}}"
                                         class="card-img-top" style="max-height:150px; object-fit:cover;">
                                    <div class="card-body text-center">
                                        <h6 th:text="${c.name}"></h6>
                                        <p th:text="${c.bio}"></p>
                                        <span class="badge"
                                              th:classappend="${c.status == 'active'} ? 'bg-success' : 'bg-secondary'"
                                              th:text="${c.status}"></span>

                                        <!-- Vote Button -->
                                        <form th:action="@{/vote/{id}(id=${c.contestantId})}" method="post" class="mt-2">
                                            <button type="submit" class="btn btn-success btn-sm"
                                                    th:disabled="${c.status != 'active'}">
                                                <i class="fas fa-vote-yea me-1"></i>Vote
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div> <!-- /session -->
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
