<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Results - Reality Show</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .winner-card {
            border: 3px solid #28a745;
            box-shadow: 0 0 15px rgba(40, 167, 69, 0.6);
            position: relative;
        }
        .winner-ribbon {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #28a745;
            color: white;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 0 0 0 8px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="bg-gray-50">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow">
    <div class="container">
        <a class="navbar-brand font-bold text-indigo-600" th:href="@{/dashboardU}">Reality Show Voting</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/epiforUser}">Episodes</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/resultsU}">Results</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
        </ul>
    </div>
</nav>

<!-- Results Section -->
<div class="container my-5">
    <h1 class="text-3xl font-bold text-center mb-4">Results</h1>
    <p class="text-center text-muted mb-5">Voting results for the latest active session</p>

    <!-- No Results Message -->
    <p th:if="${message}" class="text-center text-danger fw-bold" th:text="${message}"></p>

    <div class="row g-4 justify-content-center">
        <!-- Each Result Card -->
        <div th:each="r : ${resultList}" class="col-md-4">
            <div class="card text-center shadow h-100 rounded-3"
                 th:classappend="${r.place == 1} ? ' winner-card' : ''">
                <!-- Winner Ribbon -->
                <div th:if="${r.place == 1}" class="winner-ribbon">Winner</div>

                <div class="card-body">
                    <!-- Contestant Name -->
                    <h4 th:text="${r.contestant.name}"
                        class="card-title text-indigo-700 fw-bold">Contestant Name</h4>

                    <!-- Votes -->
                    <p class="card-text text-muted">
                        Votes: <span th:text="${r.votesCount}">0</span>
                    </p>

                    <!-- Place -->
                    <p class="fw-semibold">
                        Place: <span th:text="${r.place}">1</span>
                    </p>

                    <!-- Status -->
                    <span th:if="${r.status == 'winner'}" class="badge bg-success">Winner</span>
                    <span th:if="${r.status == 'safe'}" class="badge bg-secondary">Safe</span>
                    <span th:if="${r.status == 'eliminated'}" class="badge bg-danger">Eliminated</span>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
