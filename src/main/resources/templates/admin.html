<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management Dashboard</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" xintegrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        /* Custom styles to blend Bootstrap and Tailwind */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Tailwind's slate-50 */
        }
        /* Override Bootstrap's focus shadow with Tailwind's for consistency */
        .form-control:focus, .btn:focus {
            box-shadow: 0 0 0 0.25rem rgb(59 130 246 / 0.25); /* Tailwind's blue-500 with opacity */
            border-color: #3b82f6; /* Tailwind's blue-500 */
        }
        .modal-header, .modal-footer {
            border-color: #e5e7eb; /* Tailwind's gray-200 */
        }
        .table {
            --bs-table-bg: transparent;
            --bs-table-striped-bg: #f9fafb; /* Tailwind's gray-50 */
            --bs-table-hover-bg: #f3f4f6; /* Tailwind's gray-100 */
        }
        .btn-primary {
            --bs-btn-bg: #3b82f6;
            --bs-btn-border-color: #3b82f6;
            --bs-btn-hover-bg: #2563eb;
            --bs-btn-hover-border-color: #2563eb;
            --bs-btn-active-bg: #1d4ed8;
            --bs-btn-active-border-color: #1d4ed8;
        }
        .btn-danger {
            --bs-btn-bg: #ef4444;
            --bs-btn-border-color: #ef4444;
            --bs-btn-hover-bg: #dc2626;
            --bs-btn-hover-border-color: #dc2626;
            --bs-btn-active-bg: #b91c1c;
            --bs-btn-active-border-color: #b91c1c;
        }
    </style>
</head>
<body class="antialiased text-slate-700">

<!-- Main Container -->
<div class="container mx-auto p-4 sm:p-6 lg:p-8">

    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 pb-4 border-b border-slate-200">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800">Admin Management</h1>
            <p class="mt-1 text-sm text-slate-500">Manage all administrator accounts in the system.</p>
        </div>
        <button id="addAdminBtn" class="btn btn-primary mt-4 sm:mt-0 flex items-center gap-2 shadow-sm">
            <i class="fas fa-plus-circle"></i>
            Add New Admin
        </button>
    </header>

    <!-- Admin Table -->
    <main class="bg-white rounded-lg shadow-md overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover table-striped mb-0">
                <thead class="bg-slate-100">
                <tr>
                    <th scope="col" class="p-4 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Admin ID</th>
                    <th scope="col" class="p-4 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Name</th>
                    <th scope="col" class="p-4 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Role</th>
                    <th scope="col" class="p-4 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Contact</th>
                    <th scope="col" class="p-4 text-center text-xs font-semibold text-slate-600 uppercase tracking-wider">Actions</th>
                </tr>
                </thead>
                <tbody id="adminTableBody">
                <!-- Admin rows will be dynamically inserted here -->
                </tbody>
            </table>
        </div>
    </main>

</div>

<!-- Add/Edit Admin Modal -->
<div class="modal fade" id="adminModal" tabindex="-1" aria-labelledby="adminModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-slate-50">
                <h5 class="modal-title text-lg font-semibold text-slate-800" id="adminModalLabel">Add New Admin</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="adminForm">
                    <input type="hidden" id="adminIndex" value="">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Admin ID -->
                        <div class="mb-3">
                            <label for="adminID" class="form-label text-sm font-medium text-slate-600">Admin ID</label>
                            <input type="text" class="form-control" id="adminID" required>
                        </div>
                        <!-- Admin Name -->
                        <div class="mb-3">
                            <label for="adminName" class="form-label text-sm font-medium text-slate-600">Admin Name</label>
                            <input type="text" class="form-control" id="adminName" required>
                        </div>
                        <!-- Admin Password -->
                        <div class="mb-3">
                            <label for="adminPassword" class="form-label text-sm font-medium text-slate-600">Password</label>
                            <input type="password" class="form-control" id="adminPassword" required>
                        </div>
                        <!-- Mobile Number -->
                        <div class="mb-3">
                            <label for="mobileNumber" class="form-label text-sm font-medium text-slate-600">Mobile Number</label>
                            <input type="tel" class="form-control" id="mobileNumber" required>
                        </div>
                        <!-- Role Name -->
                        <div class="mb-3">
                            <label for="roleName" class="form-label text-sm font-medium text-slate-600">Role Name</label>
                            <input type="text" class="form-control" id="roleName" required>
                        </div>
                        <!-- Role ID -->
                        <div class="mb-3">
                            <label for="roleID" class="form-label text-sm font-medium text-slate-600">Role ID</label>
                            <input type="text" class="form-control" id="roleID" required>
                        </div>
                        <!-- Email -->
                        <div class="col-span-1 md:col-span-2 mb-3">
                            <label for="email" class="form-label text-sm font-medium text-slate-600">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <!-- Address -->
                        <div class="col-span-1 md:col-span-2 mb-3">
                            <label for="address" class="form-label text-sm font-medium text-slate-600">Address</label>
                            <textarea class="form-control" id="address" rows="3"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer bg-slate-50">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" form="adminForm" class="btn btn-primary">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">Confirm Deletion</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete this admin record? This action cannot be undone.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete Admin</button>
            </div>
        </div>
    </div>
</div>


<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- MOCK DATA ---
        let admins = [
            { adminID: 'ADM001', adminName: 'Alice Johnson', adminPassword: 'password123', roleName: 'Super Admin', roleID: 'R01', mobileNumber: '123-456-7890', email: 'alice.j@example.com', address: '123 Tech Lane, Silicon Valley' },
            { adminID: 'ADM002', adminName: 'Bob Williams', adminPassword: 'password123', roleName: 'Content Manager', roleID: 'R02', mobileNumber: '234-567-8901', email: 'bob.w@example.com', address: '456 Content Ave, Media City' },
            { adminID: 'ADM003', adminName: 'Charlie Brown', adminPassword: 'password123', roleName: 'User Manager', roleID: 'R03', mobileNumber: '345-678-9012', email: 'charlie.b@example.com', address: '789 User Blvd, Community Town' },
            { adminID: 'ADM004', adminName: 'Diana Prince', adminPassword: 'password123', roleName: 'System Analyst', roleID: 'R04', mobileNumber: '456-789-0123', email: 'diana.p@example.com', address: '101 Analysis Rd, Data Core' }
        ];

        // --- DOM ELEMENTS ---
        const adminTableBody = document.getElementById('adminTableBody');
        const addAdminBtn = document.getElementById('addAdminBtn');
        const adminForm = document.getElementById('adminForm');
        const adminModalEl = document.getElementById('adminModal');
        const adminModal = new bootstrap.Modal(adminModalEl);
        const deleteModalEl = document.getElementById('deleteModal');
        const deleteModal = new bootstrap.Modal(deleteModalEl);
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

        let adminIndexToDelete = null;

        // --- FUNCTIONS ---

        /**
         * Renders the admin data into the table.
         */
        const renderTable = () => {
            adminTableBody.innerHTML = '';
            if (admins.length === 0) {
                adminTableBody.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-slate-500">No admins found.</td></tr>`;
                return;
            }
            admins.forEach((admin, index) => {
                const row = `
                        <tr class="align-middle">
                            <td class="p-4 font-medium text-slate-800">${admin.adminID}</td>
                            <td class="p-4">${admin.adminName}</td>
                            <td class="p-4">
                                <span class="inline-block px-2 py-1 text-xs font-semibold rounded-full bg-blue-100 text-blue-800">
                                    ${admin.roleName}
                                </span>
                            </td>
                            <td class="p-4">
                                <div class="text-sm">${admin.mobileNumber}</div>
                                <div class="text-xs text-slate-500">${admin.email}</div>
                            </td>
                            <td class="p-4 text-center">
                                <button class="btn btn-sm btn-outline-secondary me-1 edit-btn" data-index="${index}" title="Edit">
                                    <i class="fas fa-pencil-alt"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger delete-btn" data-index="${index}" title="Delete">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                adminTableBody.insertAdjacentHTML('beforeend', row);
            });
        };

        /**
         * Opens the modal to add a new admin.
         */
        const openAddModal = () => {
            adminForm.reset();
            document.getElementById('adminIndex').value = '';
            document.getElementById('adminModalLabel').textContent = 'Add New Admin';
            document.getElementById('adminID').disabled = false;
            document.getElementById('adminPassword').setAttribute('required', 'required');
            adminModal.show();
        };

        /**
         * Opens the modal to edit an existing admin.
         * @param {number} index - The index of the admin in the admins array.
         */
        const openEditModal = (index) => {
            const admin = admins[index];
            adminForm.reset();
            document.getElementById('adminIndex').value = index;
            document.getElementById('adminModalLabel').textContent = 'Edit Admin';

            document.getElementById('adminID').value = admin.adminID;
            document.getElementById('adminID').disabled = true; // Prevent editing the primary key
            document.getElementById('adminName').value = admin.adminName;
            document.getElementById('adminPassword').value = '';
            document.getElementById('adminPassword').removeAttribute('required'); // Password change is optional
            document.getElementById('roleName').value = admin.roleName;
            document.getElementById('roleID').value = admin.roleID;
            document.getElementById('mobileNumber').value = admin.mobileNumber;
            document.getElementById('email').value = admin.email;
            document.getElementById('address').value = admin.address;

            adminModal.show();
        };

        /**
         * Opens the delete confirmation modal.
         * @param {number} index - The index of the admin to delete.
         */
        const openDeleteModal = (index) => {
            adminIndexToDelete = index;
            deleteModal.show();
        };

        /**
         * Handles the form submission for both adding and editing admins.
         * @param {Event} e - The form submission event.
         */
        const handleFormSubmit = (e) => {
            e.preventDefault();
            const adminIndex = document.getElementById('adminIndex').value;
            const adminData = {
                adminID: document.getElementById('adminID').value,
                adminName: document.getElementById('adminName').value,
                adminPassword: document.getElementById('adminPassword').value,
                roleName: document.getElementById('roleName').value,
                roleID: document.getElementById('roleID').value,
                mobileNumber: document.getElementById('mobileNumber').value,
                email: document.getElementById('email').value,
                address: document.getElementById('address').value,
            };

            if (adminIndex === '') {
                // Add new admin
                if (admins.some(a => a.adminID === adminData.adminID)) {
                    alert('Admin ID already exists!');
                    return;
                }
                admins.push(adminData);
            } else {
                // Update existing admin
                const originalAdmin = admins[adminIndex];
                // If password field is empty, keep the old password
                if (!adminData.adminPassword) {
                    adminData.adminPassword = originalAdmin.adminPassword;
                }
                admins[adminIndex] = adminData;
            }

            renderTable();
            adminModal.hide();
        };

        /**
         * Deletes the admin after confirmation.
         */
        const confirmDelete = () => {
            if (adminIndexToDelete !== null) {
                admins.splice(adminIndexToDelete, 1);
                renderTable();
                deleteModal.hide();
                adminIndexToDelete = null;
            }
        };


        // --- EVENT LISTENERS ---
        addAdminBtn.addEventListener('click', openAddModal);
        adminForm.addEventListener('submit', handleFormSubmit);
        confirmDeleteBtn.addEventListener('click', confirmDelete);

        // Event delegation for edit and delete buttons
        adminTableBody.addEventListener('click', (e) => {
            const editBtn = e.target.closest('.edit-btn');
            if (editBtn) {
                const index = editBtn.dataset.index;
                openEditModal(index);
            }

            const deleteBtn = e.target.closest('.delete-btn');
            if (deleteBtn) {
                const index = deleteBtn.dataset.index;
                openDeleteModal(index);
            }
        });

        // --- INITIAL RENDER ---
        renderTable();
    });
</script>
</body>
</html>
