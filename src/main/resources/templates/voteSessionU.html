<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vote Now</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --accent: #ff4d94;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            background: linear-gradient(to right, #ff4d94, #6a11cb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            color: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-success {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            border-radius: 50px;
            font-weight: 600;
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
        }
        .btn-success:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4);
        }

        .badge {
            font-size: 0.85rem;
            padding: 0.6rem 0.8rem;
            border-radius: 30px;
        }
        .bg-secondary {
            background: linear-gradient(to right, #868f96, #596164) !important;
        }

        .alert-info {
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            border: none;
            color: white;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <h2 class="text-center">Available Voting Sessions</h2>

    <div th:if="${#lists.isEmpty(sessionList)}" class="alert alert-info text-center">
        <i class="fas fa-info-circle me-2"></i>No ongoing voting sessions at the moment. Please check back later!
    </div>

    <div class="row g-4" th:if="${!#lists.isEmpty(sessionList)}">
        <div class="col-md-4" th:each="s : ${sessionList}">
            <div class="card shadow-lg h-100 p-3">
                <div class="card-body text-center">
                    <h5 class="fw-bold mb-3" th:text="${s.show.showTitle}"></h5>
                    <p class="mb-1"><i class="fas fa-play-circle me-1"></i><strong>Start:</strong>
                        <span th:text="${#temporals.format(s.startTime,'yyyy-MM-dd HH:mm')}"></span>
                    </p>
                    <p class="mb-3"><i class="fas fa-stop-circle me-1"></i><strong>End:</strong>
                        <span th:text="${#temporals.format(s.endTime,'yyyy-MM-dd HH:mm')}"></span>
                    </p>

                    <!-- ✅ Only allow voting if status is Ongoing -->
                    <div th:if="${s.status == 'Ongoing'}">
                        <a th:href="@{/contestantForUser/{id}(id=${s.show.episodeId})}"
                           class="btn btn-success w-100">
                            <i class="fas fa-vote-yea me-2"></i>Vote
                        </a>
                    </div>
                    <div th:if="${s.status != 'Ongoing'}">
                        <span class="badge bg-secondary w-100">Voting not open</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
