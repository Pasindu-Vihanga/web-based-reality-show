<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarFactor - Login Portal</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a0e17, #111827);
            color: #F9FAFB;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        /* Starfield Background */
        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
        }
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        .login-card {
            background: rgba(31, 41, 55, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
        }
        .login-btn {
            position: relative;
            overflow: hidden;
            background: linear-gradient(to right, #6366f1, #a855f7);
        }
        .login-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .login-btn:hover::after { left: 100%; }
    </style>
</head>
<body>

<!-- Starfield -->
<div class="stars" id="stars"></div>

<!-- Login Container -->
<div class="login-card">
    <div class="text-center mb-6">
        <i class="fas fa-star text-purple-500 text-4xl"></i>
        <h1 class="text-3xl font-bold mt-2">Star<span class="text-purple-500">Factor</span></h1>
        <p class="text-gray-400 mt-1">User Access Portal</p>
    </div>

    <!-- If logged in already -->
    <div th:if="${session.loggedInUser != null}" class="text-center">
        <p>You are already logged in as <strong th:text="${session.loggedInUser.username}">User</strong>.</p>
        <a th:href="@{/dashboardU}" class="login-btn block w-full text-white py-3 rounded-lg mt-3">
            <i class="fas fa-rocket mr-2"></i> Go to Dashboard
        </a>
        <a th:href="@{/logout}" class="block w-full py-3 rounded-lg mt-3 bg-red-600 hover:bg-red-700 transition text-white">
            <i class="fas fa-sign-out-alt mr-2"></i> Logout
        </a>
    </div>

    <!-- Login form if not logged in -->
    <form th:if="${session.loggedInUser == null}" th:action="@{/loginUser}" method="post" class="space-y-5">
        <!-- Username -->
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Username</label>
            <div class="relative">
                <i class="fas fa-user-astronaut absolute left-3 top-3 text-gray-500"></i>
                <input type="text" name="username" required
                       class="w-full pl-10 py-3 rounded-lg bg-gray-800 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                       placeholder="Enter username">
            </div>
        </div>

        <!-- Password -->
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
            <div class="relative">
                <i class="fas fa-lock absolute left-3 top-3 text-gray-500"></i>
                <input type="password" name="password" required
                       class="w-full pl-10 py-3 rounded-lg bg-gray-800 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                       placeholder="Enter password">
            </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="login-btn w-full py-3 rounded-lg text-white font-semibold">
            <i class="fas fa-rocket mr-2"></i> Login
        </button>

        <!-- Error -->
        <p th:if="${error}" th:text="${error}" class="text-center text-red-400 font-semibold mt-3"></p>

        <!-- Register link -->
        <p class="text-center text-sm text-gray-400 mt-4">
            New to StarFactor?
            <a th:href="@{/registerU}" class="text-purple-400 hover:text-pink-400">Create User Account</a>
        </p>

        <!-- Admin login -->
        <p class="text-center text-xs text-gray-500 mt-3 border-t border-gray-700 pt-3">
            Administrator? <a th:href="@{/loginA}" class="text-purple-400 hover:text-pink-400">Login here</a>
        </p>
    </form>
</div>

<!-- Starfield Animation -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}vw`;
            star.style.top = `${Math.random() * 100}vh`;
            star.style.animationDuration = `${(Math.random() * 5) + 5}s`;
            star.style.animationDelay = `${Math.random() * 5}s`;
            starsContainer.appendChild(star);
        }
    });
</script>
</body>
</html>
