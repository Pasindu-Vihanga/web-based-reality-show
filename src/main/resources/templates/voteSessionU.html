<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard - Reality Show</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<nav class="navbar navbar-expand-lg navbar-light bg-light shadow">
    <div class="container">
        <a class="navbar-brand font-bold text-indigo-600" href="#">Reality Show Voting</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/sessionsForUser">Active Voting</a></li>
                <li class="nav-item"><a class="nav-link" href="/results">Results</a></li>
                <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h1 class="text-2xl font-bold mb-4">Active Voting Sessions</h1>

    <!-- Loop through sessions -->
    <div class="row">
        <div th:each="session : ${sessionList}" class="col-md-6 mb-4">
            <div class="card shadow-lg rounded-2xl">
                <div class="card-body">
                    <h5 class="card-title text-indigo-600 font-semibold">Voting Session</h5>
                    <p class="card-text">
                        <strong>Start:</strong> <span th:text="${session.startTime}"></span><br>
                        <strong>End:</strong> <span th:text="${session.endTime}"></span><br>
                        <strong>Max Votes/User:</strong> <span th:text="${session.maxVotesPerUser}"></span>
                    </p>
                    <a th:href="@{'/vote/' + ${session.sessionId}}" class="btn btn-primary">Vote Now</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
