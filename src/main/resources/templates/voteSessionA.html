<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Reality Show</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand text-white" href="#">Reality Show Admin</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/episodeView">Manage Shows</a></li>
                <li class="nav-item"><a class="nav-link" href="/voteSessionA">Manage Voting Sessions</a></li>
                <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h1 class="mb-4 text-2xl font-bold">Admin Dashboard</h1>

    <div class="row g-4">
        <!-- Shows -->
        <div class="col-md-6">
            <div class="card shadow rounded-2xl">
                <div class="card-body">
                    <h5 class="card-title">Shows & Episodes</h5>
                    <p class="card-text">Create, edit, or remove shows and episodes.</p>
                    <a href="/episodeView" class="btn btn-primary">Manage Shows</a>
                </div>
            </div>
        </div>

        <!-- Sessions -->
        <div class="col-md-6">
            <div class="card shadow rounded-2xl">
                <div class="card-body">
                    <h5 class="card-title">Voting Sessions</h5>
                    <p class="card-text">Schedule, edit, or disable voting sessions.</p>
                    <a href="/voteSessionA" class="btn btn-success">Manage Sessions</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-center text-white py-3 mt-5">
    © 2025 Reality Show Voting Platform - Admin Panel
</footer>

</body>
</html>
