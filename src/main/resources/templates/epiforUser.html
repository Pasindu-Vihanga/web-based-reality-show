<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Episodes</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            margin-top: 40px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 15px;
            padding: 20px;
            color: white;
            transition: 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .card h5 {
            font-weight: bold;
        }
        .btn-back {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            border: none;
            font-weight: 600;
        }
        .search-bar input {
            border-radius: 50px;
            padding: 0.8rem 1.2rem;
        }
        .search-bar button {
            border-radius: 50px;
            padding: 0.8rem 1.5rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-tv me-2"></i>Available Episodes</h2>
        <a th:href="@{/dashboardU}" class="btn btn-back text-white">
            <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
        </a>
    </div>

    <!-- Search -->
    <form th:action="@{/search}" method="get" class="search-bar mb-4 d-flex">
        <input type="text" class="form-control me-2" name="keyword"
               th:value="${searchKeyword}" placeholder="Search episodes by title...">
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-search"></i> Search
        </button>
    </form>

    <!-- Episodes Grid -->
    <div class="row g-4">
        <div class="col-md-4" th:each="epi : ${episodeList}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 th:text="${epi.showTitle}">Show Title</h5>
                    <p class="small text-light" th:text="${epi.showDescription}">Show description...</p>
                    <p><i class="fas fa-calendar-alt me-2"></i>
                        <span th:text="${epi.showDate}">2025-01-01</span></p>
                    <p><i class="fas fa-clock me-2"></i>
                        <span th:text="${epi.showTime}">20:00</span></p>
                    <span class="badge bg-info text-dark" th:text="${epi.showType}">Type</span>

                    <!-- View Contestants Button -->
                    <div class="mt-3">
                        <a th:href="@{/contestantForUser/{id}(id=${epi.episodeId})}"
                           class="btn btn-sm btn-light">
                            <i class="fas fa-users me-1"></i> View Contestants
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- No results -->
    <div th:if="${episodeList.size() == 0}" class="text-center mt-5">
        <i class="fas fa-exclamation-circle fa-2x mb-3"></i>
        <p>No episodes available.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
