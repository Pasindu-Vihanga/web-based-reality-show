<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Episodes - VoteStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="text-center text-primary fw-bold mb-4">Episodes</h2>

    <!-- Search -->
    <form th:action="@{/search}" method="get" class="d-flex mb-4">
        <input type="text" name="keyword" th:value="${searchKeyword}" class="form-control me-2" placeholder="Search episodes...">
        <button class="btn btn-primary">Search</button>
    </form>

    <!-- Episodes -->
    <div class="row g-4">
        <div class="col-md-4" th:each="ep : ${episodeList}">
            <div class="card shadow-sm p-3 h-100">
                <h5 th:text="${ep.showTitle}">Episode</h5>
                <p th:text="${ep.showDescription}">Description...</p>
                <p><strong>Date:</strong> <span th:text="${ep.showDate}"></span></p>
                <p><strong>Status:</strong> <span class="badge bg-info" th:text="${ep.status}">Upcoming</span></p>

                <!-- Sessions -->
                <div th:each="s : ${ep.sessions}">
                    <p><strong>Voting:</strong> <span th:text="${s.status}">Live</span></p>
                    <button class="btn btn-success w-100"
                            th:if="${s.active}"
                            th:onclick="'castVote(' + ${s.sessionId} + ')'">Vote</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    function castVote(id) {
        fetch('/api/votes/cast/' + id, { method: 'POST' })
            .then(() => alert("Vote submitted!"));
    }
</script>
</body>
</html>
