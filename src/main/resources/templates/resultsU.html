<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Live Results - VoteStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="text-center text-success fw-bold mb-4">Live Contestant Rankings</h2>

    <div th:if="${message}" class="alert alert-info text-center" th:text="${message}"></div>

    <div th:if="${resultList}">
        <!-- Total Votes -->
        <div class="alert alert-secondary">
            <strong>Total Votes:</strong>
            <span th:text="${totalVotes}">0</span>
        </div>

        <!-- Ranking Table -->
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
            <tr>
                <th>Rank</th>
                <th>Contestant</th>
                <th>Votes</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r, iter : ${resultList}">
                <td th:text="${iter.index + 1}">1</td>
                <td th:text="${r.contestant.name}">Name</td>
                <td th:text="${r.votesCount}">0</td>
                <td th:text="${r.status}">safe</td>
            </tr>
            </tbody>
        </table>

        <!-- Chart -->
        <div class="card shadow mt-4">
            <div class="card-header">Popularity Tracker</div>
            <div class="card-body">
                <canvas id="liveChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    // Live Chart (reload rankings every 5 sec)
    function loadChart() {
        fetch("/api/results/rankings/latest")
            .then(res => res.json())
            .then(data => {
                const labels = data.map(r => r.contestant.name);
                const votes = data.map(r => r.votesCount);

                new Chart(document.getElementById("liveChart"), {
                    type: "bar",
                    data: {
                        labels: labels,
                        datasets: [{
                            label: "Votes",
                            data: votes,
                            backgroundColor: "rgba(75,192,192,0.6)"
                        }]
                    }
                });
            });
    }

    loadChart();
    setInterval(loadChart, 5000);
</script>
</body>
</html>
