<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Voting Sessions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="text-center text-success mb-4">Active Voting Sessions</h2>

    <div th:if="${#lists.isEmpty(sessionList)}" class="alert alert-info text-center">
        No active voting sessions right now. Please check back later!
    </div>

    <div class="row g-4" th:if="${!#lists.isEmpty(sessionList)}">
        <div class="col-md-4" th:each="s : ${sessionList}">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0" th:text="${s.show.showTitle}"></h5>
                </div>
                <div class="card-body">
                    <p><strong>Session:</strong> <span th:text="${s.sessionId}"></span></p>
                    <p><strong>Episode:</strong> <span th:text="${s.show.episodeId}"></span></p>
                    <p><strong>Period:</strong>
                        <span th:text="${#temporals.format(s.startTime, 'yyyy-MM-dd HH:mm')}"></span> -
                        <span th:text="${#temporals.format(s.endTime, 'yyyy-MM-dd HH:mm')}"></span>
                    </p>
                    <p><strong>Status:</strong> <span th:text="${s.status}"></span></p>
                    <a th:if="${s.active}"
                       th:href="@{/contestantForUser/{id}(id=${s.show.episodeId})}"
                       class="btn btn-success w-100">
                        Vote Now
                    </a>
                    <button th:if="${!s.active}" class="btn btn-secondary w-100" disabled>
                        Closed
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
