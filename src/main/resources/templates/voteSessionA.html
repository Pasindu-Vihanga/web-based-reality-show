<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Voting Sessions (Admin)</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --accent: #ff4d94;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            background: linear-gradient(to right, #ff4d94, #6a11cb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            color: white;
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 2px var(--primary);
        }

        .btn-success {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            border-radius: 50px;
            font-weight: 600;
            padding: 0.4rem 1rem;
        }
        .btn-success:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4);
        }

        .btn-primary {
            background: linear-gradient(to right, #ff4d94, #6a11cb);
            border: none;
            border-radius: 30px;
            font-weight: 600;
        }

        .btn-danger {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            border: none;
            border-radius: 30px;
            font-weight: 600;
        }

        .btn-secondary {
            background: linear-gradient(to right, #868f96, #596164);
            border: none;
            border-radius: 30px;
            font-weight: 600;
        }

        .table {
            color: white;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
        }
        .table thead {
            background: linear-gradient(to right, var(--primary), var(--secondary));
        }
        .table-hover tbody tr:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border-radius: 15px;
            backdrop-filter: blur(12px);
        }
        .modal-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .modal-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
<div class="container py-5">
    <h2 class="mb-4">Voting Session Management</h2>

    <!-- Add Session -->
    <form th:action="@{/session/add}" th:object="${newSession}" method="post" class="card p-4 mb-5 shadow-lg">
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Episode</label>
                <select th:field="*{show.episodeId}" class="form-select" required>
                    <option th:each="ep : ${episodeList}"
                            th:value="${ep.episodeId}"
                            th:text="${ep.episodeId} + ' - ' + ${ep.showTitle}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Start Time</label>
                <input th:field="*{startTime}" type="datetime-local" class="form-control"
                       placeholder="Defaults to episode date/time if left blank">
            </div>
            <div class="col-md-3">
                <label class="form-label">End Time</label>
                <input th:field="*{endTime}" type="datetime-local" class="form-control"
                       placeholder="Defaults to +1h if left blank">
            </div>
            <div class="col-md-2">
                <label class="form-label">Max Votes/User</label>
                <input th:field="*{maxVotesPerUser}" type="number" min="1" class="form-control" required>
            </div>
            <div class="col-md-1 d-flex align-items-end">
                <button type="submit" class="btn btn-success w-100">Add</button>
            </div>
        </div>
    </form>

    <!-- Sessions Table -->
    <div class="table-responsive">
        <table class="table table-hover shadow-lg">
            <thead>
            <tr>
                <th>ID</th>
                <th>Episode</th>
                <th>Start</th>
                <th>End</th>
                <th>Status</th>
                <th>Active</th>
                <th>Votes/User</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${sessionList}">
                <td th:text="${s.sessionId}"></td>
                <td th:text="${s.show.showTitle}"></td>
                <td th:text="${#temporals.format(s.startTime, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${#temporals.format(s.endTime, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${s.status}"></td>
                <td th:text="${s.active ? 'Yes' : 'No'}"></td>
                <td th:text="${s.maxVotesPerUser}"></td>
                <td>
                    <button type="button" class="btn btn-sm btn-primary"
                            data-bs-toggle="modal"
                            th:data-bs-target="'#editModal-' + ${s.sessionId}">
                        <i class="fas fa-edit me-1"></i>Edit
                    </button>
                    <form th:action="@{/session/delete/{id}(id=${s.sessionId})}" method="post" class="d-inline">
                        <button class="btn btn-sm btn-danger"><i class="fas fa-trash me-1"></i>Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Edit Session Modal -->
<div th:each="s : ${sessionList}" th:id="'editModal-' + ${s.sessionId}" class="modal fade" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/session/update}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Session (<span th:text="${s.sessionId}"></span>)</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="sessionId" th:value="${s.sessionId}"/>

                    <div class="mb-3">
                        <label class="form-label">Episode</label>
                        <select name="show.episodeId" class="form-select" required>
                            <option th:each="ep : ${episodeList}"
                                    th:value="${ep.episodeId}"
                                    th:text="${ep.episodeId} + ' - ' + ${ep.showTitle}"
                                    th:selected="${ep.episodeId == s.show.episodeId}">
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Start Time</label>
                        <input type="datetime-local" name="startTime" class="form-control"
                               th:value="${#temporals.format(s.startTime, 'yyyy-MM-dd''T''HH:mm')}"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">End Time</label>
                        <input type="datetime-local" name="endTime" class="form-control"
                               th:value="${#temporals.format(s.endTime, 'yyyy-MM-dd''T''HH:mm')}"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Max Votes/User</label>
                        <input type="number" name="maxVotesPerUser" class="form-control" min="1"
                               th:value="${s.maxVotesPerUser}"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <input type="text" name="status" class="form-control" th:value="${s.status}" readonly/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Active</label>
                        <select name="active" class="form-select">
                            <option th:value="true" th:selected="${s.active}">Yes</option>
                            <option th:value="false" th:selected="${!s.active}">No</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Save Changes</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
