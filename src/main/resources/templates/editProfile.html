<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex justify-content-center align-items-center" style="min-height: 100vh;">

<div class="card p-4 bg-secondary shadow-lg" style="max-width: 600px; width: 100%; border-radius: 15px;">
    <h2 class="text-center fw-bold mb-4">Edit Profile</h2>

    <form th:action="@{/updateProfile}" th:object="${user}" method="post" enctype="multipart/form-data">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" th:field="*{username}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" th:field="*{phoneNumber}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" th:field="*{address}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" th:field="*{password}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Profile Image</label><br>
            <img th:if="${user.imagePath != null}" th:src="@{${user.imagePath}}" alt="Profile Picture" width="100" class="mb-2 rounded">
            <input type="file" name="imageFile" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary w-100">Save Changes</button>
