<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Contestant</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6a11cb;
      --secondary: #2575fc;
      --dark: #1a1a2e;
      --light: #f8f9fa;
      --accent: #ff4d94;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: white;
      min-height: 100vh;
    }

    h4 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      background: linear-gradient(to right, #ff4d94, #6a11cb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 15px;
      backdrop-filter: blur(10px);
      color: white;
    }

    .card-header {
      background: rgba(255, 255, 255, 0.1);
      border-bottom: none;
      border-radius: 15px 15px 0 0;
    }

    .form-control, .form-select {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
    }
    .form-control:focus, .form-select:focus {
      box-shadow: 0 0 0 2px var(--primary);
    }

    .btn-primary {
      background: linear-gradient(to right, var(--primary), var(--secondary));
      border: none;
      border-radius: 50px;
      font-weight: 600;
      padding: 0.5rem 1.2rem;
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4);
    }

    .btn-secondary {
      background: linear-gradient(to right, #868f96, #596164);
      border: none;
      border-radius: 50px;
      font-weight: 600;
      padding: 0.4rem 1rem;
      color: white;
    }
    .btn-secondary:hover {
      opacity: 0.9;
    }

    .img-thumbnail {
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }
  </style>
  <script>
    function previewImage(event, previewId) {
      const reader = new FileReader();
      reader.onload = function () {
        document.getElementById(previewId).src = reader.result;
      }
      reader.readAsDataURL(event.target.files[0]);
    }
  </script>
</head>
<body>

<div class="container py-5">
  <div class="card shadow-lg">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h4><i class="fas fa-user-edit me-2"></i>Edit Contestant</h4>
      <a th:href="@{/contestantView}" class="btn btn-secondary btn-sm">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </div>
    <div class="card-body">
      <!-- ✅ multipart enabled -->
      <form th:action="@{/contestant/update}" th:object="${contestant}" method="post" enctype="multipart/form-data">

        <!-- Hidden ID -->
        <input type="hidden" th:field="*{contestantId}"/>

        <!-- Name -->
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" th:field="*{name}" class="form-control" required>
        </div>

        <!-- Bio -->
        <div class="mb-3">
          <label class="form-label">Bio</label>
          <textarea th:field="*{bio}" class="form-control" rows="3"></textarea>
        </div>

        <!-- Image Upload -->
        <div class="mb-3">
          <label class="form-label">Contestant Image</label>
          <input type="file" name="imageFile" class="form-control" accept="image/*"
                 onchange="previewImage(event, 'previewImg')">
          <div class="mt-3">
            <!-- ✅ Display existing image -->
            <img id="previewImg"
                 th:if="*{contestantId}"
                 th:src="@{'/images/' + *{contestantId}}"
                 class="img-thumbnail"
                 style="max-width:150px;">
          </div>
        </div>

        <!-- Status -->
        <div class="mb-3">
          <label class="form-label">Status</label>
          <select th:field="*{status}" class="form-select" required>
            <option value="active">Active</option>
            <option value="eliminated">Eliminated</option>
          </select>
        </div>

        <!-- Episode Dropdown -->
        <div class="mb-3">
          <label class="form-label">Episode</label>
          <select th:field="*{show.episodeId}" class="form-select" required>
            <option th:each="ep : ${episodeList}"
                    th:value="${ep.episodeId}"
                    th:text="${ep.showTitle + ' (' + ep.episodeId + ')'}"
                    th:selected="${ep.episodeId == contestant.show.episodeId}">
            </option>
          </select>
        </div>

        <!-- Submit -->
        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save me-1"></i> Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
