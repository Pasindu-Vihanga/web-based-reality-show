<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Episode Management</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

<div class="container py-5">
    <h1 class="text-3xl font-bold mb-4 text-center text-indigo-600">🎬 Episode Management</h1>

    <!-- 🔍 Search Form -->
    <form action="/episodes/search" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="keyword" class="form-control" placeholder="Search by title..." required>
            <button class="btn btn-primary" type="submit">Search</button>
        </div>
    </form>

    <!-- 💾 Create Episode Form -->
    <form action="/save" method="post" class="bg-white p-4 rounded shadow mb-5">
        <h2 class="text-xl font-semibold mb-3 text-indigo-500">Add New Episode</h2>
        <div class="row g-3">
            <div class="col-md-6">
                <input type="text" name="episodeId" class="form-control" placeholder="Episode ID" required>
            </div>
            <div class="col-md-6">
                <input type="text" name="showTitle" class="form-control" placeholder="Title" required>
            </div>
            <div class="col-md-12">
                <textarea name="showDescription" class="form-control" placeholder="Description" required></textarea>
            </div>
            <div class="col-md-6">
                <input type="text" name="showType" class="form-control" placeholder="Type (e.g. Drama)" required>
            </div>
            <div class="col-md-3">
                <input type="date" name="showDate" class="form-control" required>
            </div>
            <div class="col-md-3">
                <input type="time" name="showTime" class="form-control" required>
            </div>
            <div class="col-md-12 text-end">
                <button type="submit" class="btn btn-success">Save Episode</button>
            </div>
        </div>
    </form>

    <!-- 📋 Episode List -->
    <div class="bg-white p-4 rounded shadow">
        <h2 class="text-xl font-semibold mb-3 text-indigo-500">All Episodes</h2>
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Type</th>
                <th>Date</th>
                <th>Time</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- Example row: Replace with Thymeleaf or JSTL loop -->
            <tr th:each="episode : ${episodeList}">
                <td th:text="${episode.episodeId}">EP001</td>
                <td th:text="${episode.showTitle}">Pilot</td>
                <td th:text="${episode.showType}">Drama</td>
                <td th:text="${episode.showDate}">2025-09-16</td>
                <td th:text="${episode.showTime}">19:30</td>
                <td>
                    <a th:href="@{/episodes/delete(episodeId=${episode.episodeId})}" class="btn btn-danger btn-sm">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 🔔 Flash Message -->
    <div th:if="${message}" class="alert alert-info mt-4" th:text="${message}"></div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
