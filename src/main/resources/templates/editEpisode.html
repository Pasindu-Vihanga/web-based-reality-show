<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Episode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="mb-4"><i class="fas fa-edit me-2"></i>Edit Episode</h2>

    <form th:action="@{/update}" method="post" th:object="${show}">
        <input type="hidden" th:field="*{episodeId}"/>

        <div class="mb-3">
            <label for="showTitle" class="form-label">Title</label>
            <input type="text" th:field="*{showTitle}" class="form-control" id="showTitle" required>
        </div>

        <div class="mb-3">
            <label for="showDescription" class="form-label">Description</label>
            <textarea th:field="*{showDescription}" class="form-control" id="showDescription" rows="4" required></textarea>
        </div>

        <div class="mb-3">
            <label for="showType" class="form-label">Type</label>
            <select th:field="*{showType}" class="form-select" id="showType" required>
                <option value="">Select Type</option>
                <option value="Drama">Drama</option>
                <option value="Comedy">Comedy</option>
                <option value="Action">Action</option>
                <option value="Mystery">Mystery</option>
                <option value="Romance">Romance</option>
            </select>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="showDate" class="form-label">Date</label>
                <input type="date" th:field="*{showDate}" class="form-control" id="showDate" required>
            </div>
            <div class="col-md-6">
                <label for="showTime" class="form-label">Time</label>
                <input type="time" th:field="*{showTime}" class="form-control" id="showTime" required>
            </div>
        </div>

        <div class="d-flex justify-content-between">
            <a th:href="@{/episodeView}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-success">Update Episode</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
