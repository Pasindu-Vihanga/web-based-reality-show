<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .star {
            color: gold;
            font-size: 1.2rem;
        }
        .star-empty {
            color: #ddd;
            font-size: 1.2rem;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-4">

    <h2 class="text-primary mb-4">Your Feedback</h2>

    <!-- Flash Messages -->
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- ⭐ Average rating -->
    <div class="alert alert-info mb-4" th:if="${averageRating > 0}">
        <strong>Your Average Rating:</strong>
        <span th:text="${#numbers.formatDecimal(averageRating,1,1)}"></span> / 5
        <span>
      <!-- Render stars -->
      <span th:each="i : ${#numbers.sequence(1,5)}"
            th:classappend="${i <= averageRating} ? 'star' : 'star-empty'">★</span>
    </span>
    </div>

    <!-- Feedback Form -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/feedback/add}" th:object="${newFeedback}" method="post">
                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea th:field="*{message}" class="form-control" rows="3" required autofocus></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Rating</label>
                    <select th:field="*{rating}" class="form-select">
                        <option value="">-- Select Rating --</option>
                        <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                        <option value="4">⭐⭐⭐⭐ Good</option>
                        <option value="3">⭐⭐⭐ Average</option>
                        <option value="2">⭐⭐ Poor</option>
                        <option value="1">⭐ Very Bad</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success">Submit Feedback</button>
            </form>
        </div>
    </div>

    <!-- Past Feedback -->
    <h4 class="mb-3">Your Past Feedback</h4>
    <table class="table table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Message</th>
            <th>Rating</th>
            <th>Submitted At</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="f : ${feedbackList}">
            <td th:text="${f.message}"></td>
            <td>
        <span th:if="${f.rating != null}">
          <span th:each="i : ${#numbers.sequence(1,5)}"
                th:classappend="${i <= f.rating} ? 'star' : 'star-empty'">★</span>
        </span>
                <span th:if="${f.rating == null}">N/A</span>
            </td>
            <td th:text="${#temporals.format(f.submittedAt,'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        <tr th:if="${feedbackList == null or feedbackList.isEmpty()}">
            <td colspan="3" class="text-center text-muted">No feedback submitted yet.</td>
        </tr>
        </tbody>
    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
