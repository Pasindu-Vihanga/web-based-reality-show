<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contestants</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --accent: #ff4d94;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            background: linear-gradient(to right, #ff4d94, #6a11cb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(10px);
            color: white;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-weight: 600;
            font-size: 1.2rem;
        }

        .btn-success {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            border-radius: 50px;
            padding: 0.5rem 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-success:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4);
        }

        .btn-outline-primary {
            border-color: var(--accent);
            color: var(--accent);
            border-radius: 50px;
        }

        .btn-outline-primary:hover {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            border: none;
        }

        .badge {
            font-size: 0.85rem;
            padding: 0.4rem 0.8rem;
            border-radius: 30px;
        }
    </style>
</head>
<body>
<div class="container py-5">

    <h2 class="text-center mb-5">
        Contestants for Episode <span th:text="${episodeId}"></span>
    </h2>

    <!-- Messages -->
    <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>
    <div th:if="${message}" class="alert alert-success text-center" th:text="${message}"></div>

    <!-- Contestants -->
    <div th:if="${#lists.isEmpty(contestantList)}" class="alert alert-info text-center">
        No contestants available for this episode.
    </div>

    <div class="row g-4" th:if="${!#lists.isEmpty(contestantList)}">
        <div class="col-md-4" th:each="c : ${contestantList}">
            <div class="card shadow-sm h-100">

                <!-- Contestant Image -->
                <img th:if="${c.image != null}"
                     th:src="@{'/images/' + ${c.contestantId}}"
                     class="card-img-top"
                     alt="Contestant Image"
                     style="height:220px; object-fit:cover;">

                <div class="card-body text-center">
                    <h5 th:text="${c.name}" class="card-title"></h5>
                    <p th:text="${c.bio}" class="card-text text-light"></p>
                    <span class="badge"
                          th:classappend="${c.status == 'active'} ? 'bg-success' : 'bg-secondary'"
                          th:text="${c.status}"></span>

                    <!-- ✅ Voting UI -->
                    <div class="mt-3" th:if="${currentSessionId != null}">
                        <!-- Show Vote button only if not voted yet -->
                        <form th:if="${session['voted-' + currentSessionId] == null}"
                              th:action="@{/vote/{id}(id=${c.contestantId})}"
                              method="post">
                            <button type="submit"
                                    class="btn btn-success btn-sm w-100"
                                    th:disabled="${c.status != 'active'}">
                                Vote
                            </button>
                        </form>

                        <!-- Show "Voted" if already voted -->
                        <div th:if="${session['voted-' + currentSessionId] != null}">
                            <button class="btn btn-secondary btn-sm w-100" disabled>
                                Voted &#10003;
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Back Button -->
    <div class="text-center mt-5">
        <a href="/epiforUser" class="btn btn-outline-primary">Back to Episodes</a>
    </div>
</div>
</body>
</html>
