<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register Admin</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-xl shadow-lg w-full max-w-2xl overflow-hidden">
    <!-- Header Section -->
    <div class="bg-blue-600 text-white p-6">
        <h1 class="text-2xl font-bold flex items-center">
            <i class="bi bi-person-plus mr-2"></i> Register New Administrator
        </h1>
        <p class="text-blue-100 mt-1">Create a new admin account with appropriate permissions</p>
    </div>

    <!-- Form Section -->
    <form action="/admin/save" method="post" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Admin ID -->
        <div class="md:col-span-2">
            <label class="block text-gray-700 font-medium mb-2" for="adminID">
                Admin ID <span class="text-red-500">*</span>
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <i class="bi bi-person-badge text-gray-400"></i>
                </div>
                <input type="text" id="adminID" name="adminID" required
                       class="w-full pl-10 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                       placeholder="Enter unique admin ID">
            </div>
        </div>

        <!-- Name -->
        <div>
            <label class="block text-gray-700 font-medium mb-2" for="adminName">
                Full Name <span class="text-red-500">*</span>
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <i class="bi bi-person text-gray-400"></i>
                </div>
                <input type="text" id="adminName" name="adminName" required
                       class="w-full pl-10 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                       placeholder="Admin full name">
            </div>
        </div>

        <!-- Password -->
        <div>
            <label class="block text-gray-700 font-medium mb-2" for="adminPassword">
                Password <span class="text-red-500">*</span>
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <i class="bi bi-lock text-gray-400"></i>
                </div>
                <input type="password" id="adminPassword" name="adminPassword" required
                       class="w-full pl-10 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                       placeholder="Create secure password">
            </div>
        </div>

        <!-- Role Name -->
        <div>
            <label class="block text-gray-700 font-medium mb-2" for="roleName">
                Role Name
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <i class="bi bi-tag text-gray-400"></i>
                </div>
                <input type="text" id="roleName" name="roleName"
                       class="w-full pl-10 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                       placeholder="e.g., Super Admin">
            </div>
        </div>

        <!-- Role ID -->
        <div>
            <label class="block text-gray-700 font-medium mb-2" for="roleID">
                Role ID
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <i class="bi bi-key text-gray-400"></i>
                </div>
                <input type="text" id="roleID" name="roleID"
                       class="w-full pl-10 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                       placeholder="Role identifier">
            </div>
        </div>

        <!-- Mobile -->
        <div>
            <label class="block text-gray-700 font-medium mb-2" for="mobileNumber">
                Mobile Number
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <i class="bi bi-phone text-gray-400"></i>
                </div>
                <input type="text" id="mobileNumber" name="mobileNumber"
                       class="w-full pl-10 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                       placeholder="+1 234 567 890">
            </div>
        </div>

        <!-- Email -->
        <div>
            <label class="block text-gray-700 font-medium mb-2" for="email">
                Email Address
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <i class="bi bi-envelope text-gray-400"></i>
                </div>
                <input type="email" id="email" name="email"
                       class="w-full pl-10 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                       placeholder="admin@example.com">
            </div>
        </div>

        <!-- Address -->
        <div class="md:col-span-2">
            <label class="block text-gray-700 font-medium mb-2" for="address">
                Address
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pt-3 pointer-events-none">
                    <i class="bi bi-geo-alt text-gray-400"></i>
                </div>
                <input type="text" id="address" name="address"
                       class="w-full pl-10 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                       placeholder="Full address">
            </div>
        </div>

        <!-- Buttons -->
        <div class="md:col-span-2 flex flex-col sm:flex-row gap-3 mt-2">
            <button type="submit"
                    class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition flex items-center justify-center">
                <i class="bi bi-check-circle mr-2"></i> Save Admin
            </button>
            <a href="/"
               class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-3 px-4 rounded-lg transition flex items-center justify-center">
                <i class="bi bi-house mr-2"></i> Back to Home
            </a>
        </div>
    </form>

    <!-- Footer Note -->
    <div class="bg-gray-50 px-6 py-4 text-center border-t">
        <p class="text-sm text-gray-600">Fields marked with <span class="text-red-500">*</span> are required</p>
    </div>
</div>
</body>
</html>
