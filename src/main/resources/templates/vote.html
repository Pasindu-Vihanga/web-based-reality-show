<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vote - Reality Show</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --accent: #ff4d94;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
        }
        .navbar-brand {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            background: linear-gradient(to right, #ff4d94, #6a11cb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-link {
            color: white !important;
            font-weight: 500;
        }
        .nav-link:hover {
            color: var(--accent) !important;
        }

        h1, h3 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            background: linear-gradient(to right, #ff4d94, #6a11cb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Cards */
        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            color: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
        }
        .card-title {
            font-weight: 600;
            font-size: 1.2rem;
        }
        .card-text {
            color: #dcdcdc;
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            border-radius: 50px;
            font-weight: 600;
        }
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4);
        }
        .btn-success {
            background: linear-gradient(to right, #00b09b, #96c93d);
            border: none;
            border-radius: 50px;
            font-weight: 600;
        }
        .btn-success:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 176, 155, 0.4);
        }

        /* Alerts */
        .alert-info {
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            color: white;
            border: none;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark shadow">
    <div class="container">
        <a class="navbar-brand" href="/sessionsForUser">Reality Show Voting</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/sessionsForUser">Active Sessions</a></li>
                <li class="nav-item"><a class="nav-link" href="/results">Results</a></li>
                <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Content -->
<div class="container my-5">
    <h1 class="text-center mb-4">Vote for Your Favorite Contestant</h1>

    <!-- Session Info -->
    <div class="alert alert-info text-center mb-5">
        Voting open from <strong th:text="${session.startTime}"></strong>
        to <strong th:text="${session.endTime}"></strong>. <br>
        Max votes per user: <strong th:text="${session.maxVotesPerUser}"></strong>
    </div>

    <!-- Contestant List -->
    <div class="row">
        <div th:each="contestant : ${contestantList}" class="col-md-4 mb-4">
            <div class="card shadow-lg h-100">
                <img th:src="@{${contestant.imageUrl}}" class="card-img-top" alt="Contestant Image" style="height:220px; object-fit:cover; border-radius:15px 15px 0 0;">
                <div class="card-body text-center">
                    <h5 class="card-title" th:text="${contestant.name}">Contestant Name</h5>
                    <p class="card-text" th:text="${contestant.bio}">Contestant Bio</p>
                    <form th:action="@{'/vote/' + ${session.sessionId} + '/' + ${contestant.id}}" method="post">
                        <button type="submit" class="btn btn-primary mt-2 w-100">
                            <i class="fas fa-vote-yea me-2"></i>Vote
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Feedback Section -->
<div class="container my-5">
    <h3 class="mb-3">Leave Feedback</h3>
    <div class="card shadow-lg p-4">
        <form th:action="@{'/feedback/' + ${session.sessionId}}" method="post">
            <textarea name="feedback" class="form-control mb-3" rows="4" placeholder="Your thoughts about the show..."></textarea>
            <button type="submit" class="btn btn-success"><i class="fas fa-paper-plane me-2"></i>Submit Feedback</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
