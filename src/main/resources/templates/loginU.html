<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarFactor - Login</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .login-card {
            background: rgba(26, 26, 46, 0.9);
            padding: 2rem;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        .form-control {
            border-radius: 50px;
            padding: 0.8rem 1.2rem;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.4);
            color: white;
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .btn-login {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            border: none;
            border-radius: 50px;
            padding: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-login:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4);
        }
        .error-text {
            color: #ff4d94;
            text-align: center;
            margin-top: 1rem;
        }
        .extra-links {
            margin-top: 1rem;
            text-align: center;
        }
        .extra-links a {
            color: #2575fc;
            text-decoration: none;
            font-weight: 500;
        }
        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2 class="text-center fw-bold mb-4">Login</h2>

    <!-- If user is already logged in -->
    <div th:if="${session.loggedInUser != null}" class="text-center">
        <p>You are already logged in as
            <strong th:text="${session.loggedInUser.username}">User</strong>.
        </p>
        <a th:href="@{/dashboardU}" class="btn btn-login mt-3">Go to Dashboard</a>
        <a th:href="@{/logout}" class="btn btn-danger mt-3 w-100">Logout</a>
    </div>

    <!-- Login Form -->
    <form th:if="${session.loggedInUser == null}" th:action="@{/loginUser}" method="post">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-login">Login</button>

        <!-- Error message -->
        <p th:if="${error}" th:text="${error}" class="error-text"></p>

        <!-- Register link -->
        <div class="extra-links">
            <p>Don't have an account?
                <a th:href="@{/registerU}">Register</a>
            </p>
        </div>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
