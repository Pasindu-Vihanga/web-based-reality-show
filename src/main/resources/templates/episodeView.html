<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Episode Management - VoteStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #f9fafb; }
        .card { border-radius: 15px; }
        .modal-lg { max-width: 900px; }
    </style>
</head>
<body>

<div class="container mt-4">
    <h2 class="text-center text-primary fw-bold mb-4">Episode & Session Management</h2>

    <!-- Add Episode -->
    <form th:action="@{/add}" method="post" class="mb-4 p-3 border rounded bg-light">
        <h5>Add New Episode</h5>
        <div class="row g-3">
            <div class="col-md-3"><input type="text" name="showTitle" class="form-control" placeholder="Title" required></div>
            <div class="col-md-3"><input type="date" name="showDate" class="form-control" required></div>
            <div class="col-md-2"><input type="time" name="showTime" class="form-control"></div>
            <div class="col-md-2">
                <select name="status" class="form-select">
                    <option>Upcoming</option>
                    <option>Live</option>
                    <option>Ended</option>
                </select>
            </div>
            <div class="col-md-2"><button class="btn btn-success w-100">Add</button></div>
        </div>
    </form>

    <!-- Episodes Table -->
    <table class="table table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>Title</th><th>Date</th><th>Time</th><th>Status</th><th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ep : ${episodeList}">
            <td th:text="${ep.showTitle}">Title</td>
            <td th:text="${ep.showDate}">2025-09-21</td>
            <td th:text="${ep.showTime}">20:00</td>
            <td><span class="badge bg-info" th:text="${ep.status}">Upcoming</span></td>
            <td>
                <form th:action="@{'/delete/' + ${ep.episodeId}}" method="post" class="d-inline">
                    <button class="btn btn-danger btn-sm">Delete</button>
                </form>
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal"
                        th:data-bs-target="'#sessionsModal-' + ${ep.episodeId}">
                    Manage Sessions
                </button>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Sessions Modal per Episode -->
    <div th:each="ep : ${episodeList}" th:id="'sessionsModal-' + ${ep.episodeId}" class="modal fade">
        <div class="modal-dialog modal-lg">
            <div class="modal-content p-3">
                <h5 th:text="'Voting Sessions for ' + ${ep.showTitle}" class="mb-3"></h5>

                <!-- Add Session -->
                <form th:action="@{/session/add}" method="post" class="row g-2 mb-3">
                    <input type="hidden" name="episodeId" th:value="${ep.episodeId}">
                    <div class="col-md-3"><input type="datetime-local" name="startTime" class="form-control" required></div>
                    <div class="col-md-3"><input type="datetime-local" name="endTime" class="form-control" required></div>
                    <div class="col-md-2"><input type="number" name="maxVotesPerUser" class="form-control" placeholder="Max Votes" required></div>
                    <div class="col-md-2">
                        <select name="active" class="form-select">
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>
                    <div class="col-md-2"><button class="btn btn-success w-100">Add</button></div>
                </form>

                <!-- Sessions Table -->
                <table class="table table-sm table-bordered">
                    <thead>
                    <tr><th>Start</th><th>End</th><th>Status</th><th>Votes</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${ep.sessions}">
                        <td th:text="${s.startTime}">Start</td>
                        <td th:text="${s.endTime}">End</td>
                        <td>
                            <span th:text="${s.status}"
                                  th:classappend="${s.active} ? 'badge bg-success' : 'badge bg-secondary'">Live</span>
                        </td>
                        <td th:text="${s.currentVotes}">0</td>
                        <td>
                            <form th:action="@{'/session/delete/' + ${s.sessionId}}" method="post" class="d-inline">
                                <button class="btn btn-danger btn-sm">Delete</button>
                            </form>
                            <button class="btn btn-warning btn-sm"
                                    th:onclick="'toggleSession(' + ${s.sessionId} + ')'">Toggle</button>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <!-- Live Vote Monitor -->
                <canvas th:id="'chart-' + ${ep.episodeId}" height="150"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleSession(id) {
        fetch('/api/votes/toggle/' + id, { method: 'POST' })
            .then(() => location.reload());
    }
</script>
</body>
</html>
