<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vote Sessions - VoteStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a2e0adfb58.js" crossorigin="anonymous"></script>
    <style>
        body { background: #f9fafb; font-family: 'Poppins', sans-serif; }
        .card { border-radius: 15px; transition: transform .2s; }
        .card:hover { transform: translateY(-5px); }
        .status { font-weight: 600; }
    </style>
</head>
<body>
<div class="container mt-4">
    <h2 class="text-center text-indigo-600 fw-bold mb-4">
        <i class="fas fa-vote-yea me-2"></i> Active Voting Sessions
    </h2>

    <!-- Session Cards -->
    <div class="row g-4">
        <div class="col-md-4" th:each="session : ${sessionList}">
            <div class="card shadow p-3 h-100 d-flex flex-column">
                <h5 th:text="${session.show.showTitle}">Episode Title</h5>
                <p class="text-muted mb-1" th:text="${session.show.showDescription}">Description...</p>
                <p><strong>Voting Period:</strong></p>
                <p>
                    <i class="fas fa-clock text-success"></i>
                    <span th:text="${session.startTime}"></span> →
                    <span th:text="${session.endTime}"></span>
                </p>
                <p><strong>Max Votes/User:</strong> <span th:text="${session.maxVotesPerUser}"></span></p>
                <p><strong>Status:</strong>
                    <span class="status text-success" th:if="${session.active}">Active</span>
                    <span class="status text-danger" th:if="${!session.active}">Inactive</span>
                </p>

                <!-- Vote Button -->
                <button type="button" class="btn btn-primary mt-auto vote-btn"
                        th:attr="data-session-id=${session.sessionId}">
                    <i class="fas fa-check-circle me-2"></i> Cast Vote
                </button>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(sessionList)}" class="text-center text-muted">
            <i class="fas fa-info-circle"></i> No active voting sessions available.
        </div>
    </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".vote-btn").forEach(button => {
            button.addEventListener("click", () => {
                const sessionId = button.getAttribute("data-session-id");

                fetch(`/api/votes/cast/${sessionId}`, {
                    method: "POST"
                })
                    .then(res => res.text())
                    .then(msg => {
                        alert(msg); // ✅ simple feedback, can be upgraded to toast
                    })
                    .catch(err => console.error(err));
            });
        });
    });
</script>
</body>
</html>
