<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Results Management - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="text-center text-primary fw-bold mb-4">Results Management</h2>

    <!-- Actions -->
    <div class="d-flex justify-content-between mb-3">
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Back to Dashboard</a>
        <button id="cleanBtn" class="btn btn-danger">Clean Invalid Results</button>
    </div>

    <!-- Total Votes -->
    <div class="alert alert-info">
        <strong>Total Votes (All Sessions):</strong>
        <span th:text="${#numbers.formatInteger(resultList.stream().mapToInt(r -> r.votesCount).sum(), 0)}">0</span>
    </div>

    <!-- Results Table -->
    <div class="card shadow">
        <div class="card-header">All Results</div>
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Session</th>
                    <th>Contestant</th>
                    <th>Votes</th>
                    <th>Place</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${resultList}">
                    <td th:text="${r.resultId}">1</td>
                    <td th:text="${r.votingSession.sessionId}">session</td>
                    <td th:text="${r.contestant.name}">Contestant</td>
                    <td th:text="${r.votesCount}">10</td>
                    <td th:text="${r.place}">1</td>
                    <td th:text="${r.status}">safe</td>
                    <td>
                        <a th:href="@{'/result/edit/' + ${r.resultId}}" class="btn btn-sm btn-warning">Edit</a>
                        <form th:action="@{'/result/delete/' + ${r.resultId}}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Rankings Chart -->
    <div class="card shadow mt-4">
        <div class="card-header">Contestant Popularity Tracker</div>
        <div class="card-body">
            <canvas id="rankingChart"></canvas>
        </div>
    </div>
</div>

<script>
    // Cleanup button
    document.getElementById("cleanBtn").addEventListener("click", () => {
        fetch("/api/results/clean", { method: "POST" })
            .then(r => r.text())
            .then(msg => alert(msg));
    });

    // Rankings Chart (load latest session)
    fetch("/api/results/rankings/latest")
        .then(res => res.json())
        .then(data => {
            const labels = data.map(r => r.contestant.name);
            const votes = data.map(r => r.votesCount);

            new Chart(document.getElementById("rankingChart"), {
                type: "bar",
                data: {
                    labels: labels,
                    datasets: [{
                        label: "Votes",
                        data: votes,
                        backgroundColor: "rgba(54,162,235,0.6)"
                    }]
                }
            });
        });
</script>
</body>
</html>
