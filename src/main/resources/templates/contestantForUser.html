<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contestants - User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<nav class="navbar navbar-expand-lg navbar-light bg-light shadow">
    <div class="container">
        <a class="navbar-brand font-bold text-indigo-600" href="/sessionsForUser">Reality Show Voting</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/sessionsForUser">Sessions</a></li>
            <li class="nav-item"><a class="nav-link" href="/results">Results</a></li>
        </ul>
    </div>
</nav>

<div class="container my-5">
    <h1 class="text-2xl font-bold mb-4 text-center">Contestants for Episode</h1>

    <div class="row">
        <div th:each="contestant : ${contestantList}" class="col-md-4 mb-4">
            <div class="card shadow-lg rounded-2xl h-100">
                <img th:src="@{${contestant.imageUrl}}" class="card-img-top rounded-t-2xl" alt="Contestant Image">
                <div class="card-body text-center">
                    <h5 class="card-title text-indigo-700 font-semibold" th:text="${contestant.name}">Contestant Name</h5>
                    <p class="card-text text-gray-600" th:text="${contestant.bio}">Contestant Bio</p>
                    <form th:action="@{'/vote/' + ${contestant.contestantId}}" method="post">
                        <button type="submit" class="btn btn-success mt-2 w-100">Vote</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-light text-center py-3 mt-5 shadow-inner">
    © 2025 Reality Show Voting Platform - User Panel
</footer>

</body>
</html>
