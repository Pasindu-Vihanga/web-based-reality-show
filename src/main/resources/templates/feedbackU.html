<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Feedback</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --accent: #ff4d94;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
        }

        h2, h4 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            background: linear-gradient(to right, #ff4d94, #6a11cb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            color: white;
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 2px var(--primary);
        }

        .btn-success {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            border-radius: 50px;
            font-weight: 600;
            padding: 0.5rem 1.2rem;
            transition: all 0.3s ease;
        }
        .btn-success:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4);
        }

        .table {
            color: white;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
        }
        .table thead {
            background: linear-gradient(to right, var(--primary), var(--secondary));
        }
        .table-hover tbody tr:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* Stars */
        .star {
            color: #ffcc00;
            font-size: 1.2rem;
        }
        .star-empty {
            color: #666;
            font-size: 1.2rem;
        }

        /* Alerts */
        .alert-info {
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            color: white;
            border: none;
        }
        .alert-success {
            background: linear-gradient(to right, #00b09b, #96c93d);
            color: white;
            border: none;
        }
        .alert-danger {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            border: none;
        }
    </style>
</head>
<body>

<div class="container py-5">

    <h2 class="mb-4 text-center">Your Feedback</h2>

    <!-- Flash Messages -->
    <div th:if="${message}" class="alert alert-success text-center" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>

    <!-- ⭐ Average rating -->
    <div class="alert alert-info text-center mb-4" th:if="${averageRating > 0}">
        <strong>Your Average Rating:</strong>
        <span th:text="${#numbers.formatDecimal(averageRating,1,1)}"></span> / 5
        <div class="mt-2">
            <span th:each="i : ${#numbers.sequence(1,5)}"
                  th:classappend="${i <= averageRating} ? 'star' : 'star-empty'">★</span>
        </div>
    </div>

    <!-- Feedback Form -->
    <div class="card shadow-lg mb-5 p-4">
        <div class="card-body">
            <form th:action="@{/feedback/add}" th:object="${newFeedback}" method="post">
                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea th:field="*{message}" class="form-control" rows="3" required autofocus></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Rating</label>
                    <select th:field="*{rating}" class="form-select">
                        <option value="">-- Select Rating --</option>
                        <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                        <option value="4">⭐⭐⭐⭐ Good</option>
                        <option value="3">⭐⭐⭐ Average</option>
                        <option value="2">⭐⭐ Poor</option>
                        <option value="1">⭐ Very Bad</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success"><i class="fas fa-paper-plane me-2"></i>Submit Feedback</button>
            </form>
        </div>
    </div>

    <!-- Past Feedback -->
    <h4 class="mb-3">Your Past Feedback</h4>
    <div class="table-responsive">
        <table class="table table-hover shadow-lg">
            <thead>
            <tr>
                <th>Message</th>
                <th>Rating</th>
                <th>Submitted At</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="f : ${feedbackList}">
                <td th:text="${f.message}"></td>
                <td>
                    <span th:if="${f.rating != null}">
                      <span th:each="i : ${#numbers.sequence(1,5)}"
                            th:classappend="${i <= f.rating} ? 'star' : 'star-empty'">★</span>
                    </span>
                    <span th:if="${f.rating == null}">N/A</span>
                </td>
                <td th:text="${#temporals.format(f.submittedAt,'yyyy-MM-dd HH:mm')}"></td>
            </tr>
            <tr th:if="${feedbackList == null or feedbackList.isEmpty()}">
                <td colspan="3" class="text-center text-muted">No feedback submitted yet.</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
