<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Result Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="text-primary">Voting Results</h2>

    <!-- Results Table -->
    <table class="table table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Session</th>
            <th>Contestant</th>
            <th>Votes</th>
            <th>Place</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${resultList}">
            <td th:text="${r.votingSession.sessionId}"></td>
            <td th:text="${r.contestant.name}"></td>
            <td th:text="${r.votesCount}"></td>
            <td th:text="${r.place}"></td>
            <td>
        <span class="badge"
              th:classappend="${r.status == 'winner'} ? 'bg-warning text-dark' :
                              (${r.status == 'eliminated'} ? 'bg-danger' : 'bg-success')"
              th:text="${r.status}">
        </span>
            </td>
            <td>
                <!-- Edit Button -->
                <button type="button" class="btn btn-primary btn-sm"
                        data-bs-toggle="modal"
                        th:data-bs-target="'#editModal-' + ${r.resultId}">
                    Edit
                </button>

                <!-- Delete Form -->
                <form th:action="@{/result/delete/{id}(id=${r.resultId})}" method="post" class="d-inline">
                    <button class="btn btn-danger btn-sm">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- ================== Edit Modals ================== -->
<div th:each="r : ${resultList}" th:id="'editModal-' + ${r.resultId}" class="modal fade" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/result/update}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Result</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- Hidden ID -->
                    <input type="hidden" name="resultId" th:value="${r.resultId}"/>

                    <div class="mb-3">
                        <label>Contestant</label>
                        <input type="text" class="form-control" th:value="${r.contestant.name}" readonly>
                    </div>

                    <div class="mb-3">
                        <label>Votes Count</label>
                        <input type="number" name="votesCount" th:value="${r.votesCount}" class="form-control" min="0" required>
                    </div>

                    <div class="mb-3">
                        <label>Place</label>
                        <input type="number" name="place" th:value="${r.place}" class="form-control" min="1">
                    </div>

                    <div class="mb-3">
                        <label>Status</label>
                        <select name="status" class="form-select" th:value="${r.status}">
                            <option value="safe">Safe</option>
                            <option value="eliminated">Eliminated</option>
                            <option value="winner">Winner</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Save Changes</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
