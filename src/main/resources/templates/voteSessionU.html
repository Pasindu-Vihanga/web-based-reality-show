<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vote Now</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="text-center text-success">Available Voting Sessions</h2>

    <div class="row g-4">
        <div class="col-md-4" th:each="s : ${sessionList}">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 th:text="${s.show.showTitle}"></h5>
                    <p><strong>Start:</strong> <span th:text="${s.startTime}"></span></p>
                    <p><strong>End:</strong> <span th:text="${s.endTime}"></span></p>
                    <a th:href="@{/contestantForUser/{id}(id=${s.show.episodeId})}" class="btn btn-success w-100">Vote</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
