<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contestants Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="fw-bold text-primary">Contestants Management</h2>

    <!-- Contestants Table -->
    <table class="table table-striped shadow">
        <thead class="table-dark"><tr><th>Image</th><th>Name</th><th>Bio</th><th>Status</th><th>Episode</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="c : ${contestantList}">
            <td><img th:if="${c.image != null}" th:src="@{'/contestant/image/' + ${c.contestantId}}" class="img-thumbnail" style="max-width:80px"></td>
            <td th:text="${c.name}"></td>
            <td th:text="${c.bio}"></td>
            <td th:text="${c.status}"></td>
            <td th:text="${c.show.showTitle}"></td>
            <td>
                <a th:href="@{/contestant/edit/{id}(id=${c.contestantId})}" class="btn btn-sm btn-warning">Edit</a>
                <form th:action="@{/contestant/delete/{id}(id=${c.contestantId})}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
