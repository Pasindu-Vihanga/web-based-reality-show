<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Feedback Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .star {
            color: gold;
            font-size: 1.1rem;
        }
        .star-empty {
            color: #ddd;
            font-size: 1.1rem;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-4">

    <h2 class="text-primary mb-4">All Feedback</h2>

    <!-- ⭐ Overall average rating -->
    <div class="alert alert-info mb-4" th:if="${averageRating > 0}">
        <strong>Average Rating (All Users):</strong>
        <span th:text="${#numbers.formatDecimal(averageRating,1,1)}"></span> / 5
        <span>
      <span th:each="i : ${#numbers.sequence(1,5)}"
            th:classappend="${i <= averageRating} ? 'star' : 'star-empty'">★</span>
    </span>
    </div>

    <!-- Feedback Table -->
    <table class="table table-bordered table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>User</th>
            <th>Message</th>
            <th>Rating</th>
            <th>Submitted At</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="f : ${feedbackList}">
            <td th:text="${f.user.username + ' (' + f.user.email + ')'}"></td>
            <td th:text="${f.message}"></td>
            <td>
        <span th:if="${f.rating != null}">
          <span th:each="i : ${#numbers.sequence(1,5)}"
                th:classappend="${i <= f.rating} ? 'star' : 'star-empty'">★</span>
        </span>
                <span th:if="${f.rating == null}">N/A</span>
            </td>
            <td th:text="${#temporals.format(f.submittedAt,'yyyy-MM-dd HH:mm')}"></td>
            <td>
                <form th:action="@{/admin/feedback/delete/{id}(id=${f.feedbackId})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${feedbackList == null or feedbackList.isEmpty()}">
            <td colspan="5" class="text-center text-muted">No feedback available.</td>
        </tr>
        </tbody>
    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
