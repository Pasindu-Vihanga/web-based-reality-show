<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .edit-card {
            max-width: 600px;
            margin: 50px auto;
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid white;
            object-fit: cover;
            margin-bottom: 15px;
        }
        label {
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="edit-card">
        <h2 class="text-center mb-4">Edit Profile</h2>

        <!-- Current Profile Image -->
        <div class="text-center">
            <img th:if="${user.photo != null}" th:src="@{'/user/photo/' + ${user.userId}}"
                 alt="Profile Picture" class="profile-img">
            <img th:if="${user.photo == null}" src="/images/default-avatar.png"
                 alt="Default Profile" class="profile-img">
        </div>

        <!-- Edit Form -->
        <form th:action="@{/updateProfile}" th:object="${user}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{userId}">

            <div class="mb-3">
                <label>Username</label>
                <input type="text" th:field="*{username}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" th:field="*{email}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Phone Number</label>
                <input type="text" th:field="*{phoneNumber}" class="form-control">
            </div>

            <div class="mb-3">
                <label>Address</label>
                <input type="text" th:field="*{address}" class="form-control">
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" th:field="*{password}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Profile Photo</label>
                <input type="file" name="imageFile" class="form-control">
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save"></i> Save Changes
                </button>
                <a th:href="@{/dashboardU}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
